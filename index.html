}
function norm(v){ return typeof v==='number' ? Math.round(v*100)/100 : v; }
function checkResult(res, lesson){
  if(!lesson.expect || !res || !res.length) return null;
  const got = res[0].values.map(r=>r.map(norm).join('|')).sort();
  const exp = lesson.expect.map(r=>r.map(norm).join('|')).sort();
  return JSON.stringify(got)===JSON.stringify(exp);
}
function renderDbViewer(){
  const el = document.getElementById('dbview');
  if(!el || !db) return;
  try{
    const tables = db.exec("SELECT name FROM sqlite_master WHERE type='table' AND name NOT LIKE 'sqlite_%' ORDER BY name");
    if(!tables.length){ el.innerHTML = '<p>No tables loaded.</p>'; return; }
    el.innerHTML = tables[0].values.map(([t])=>{
      const cnt = db.exec(`SELECT COUNT(*) FROM "${t}"`)[0].values[0][0];
      const res = db.exec(`SELECT * FROM "${t}" LIMIT 50`);
      if(!res.length) return `<h4>${t}</h4><div class="rowcount">0 rows</div>`;
      const {columns, values} = res[0];
      return `<h4>${t}</h4><div class="rowcount">${cnt} row${cnt===1?'':'s'}${cnt>50?' — showing first 50':''}</div>
        <div class="tblwrap"><table class="res"><tr>${columns.map(c=>`<th>${c}</th>`).join('')}</tr>${values.map(r=>`<tr>${r.map(v=>`<td>${v===null?'<em>NULL</em>':v}</td>`).join('')}</tr>`).join('')}</table></div>`;
    }).join('');
  }catch(e){ el.innerHTML = '<p>Could not read the database: '+e.message+'</p>'; }
}
const STORIES = {
'1.2':{situation:'The revenue ranking from last week did its job — Maya now knows latte carries the shop. But a menu has room to feature maybe two drinks, and “the full ranking” isn’t a decision. Her staff keep pitching favorites: matcha is photogenic, espresso is classic, cold brew is trending. Everyone has an opinion, and every opinion points at a different drink.', task:'Maya cuts through it with a rule instead of a debate: “Only show me drinks that have already proven they can sell — four orders or more.” That turns the ask into a filtering job on the grouped result from 1.1. The condition is about a group total (orders per drink), not about any single row, so the work is: group first, count inside the group, then keep only the groups that clear the bar.', action:'HAVING is the clause built for exactly this. WHERE runs before grouping and can only see individual orders — asking WHERE to filter on COUNT(*) is asking it to judge a total that doesn’t exist yet. HAVING runs after GROUP BY, when each drink has become one row with its count attached, and it keeps latte (5 orders) and cold brew (4) while matcha and espresso (3 each) fall away.', result:'The promotion list writes itself: two drinks, both proven. Matcha and espresso aren’t banned — they’re just not featured until they earn a fourth order. Maya’s chalkboard argument is over, and it ended with a threshold instead of a taste contest.', learning:'About the SQL: the difference between WHERE and HAVING is timing — rows before grouping, groups after. About the business language: “proven seller” only means something once you attach a number to it. “Drinks with four or more orders” is a rule a whole staff can apply the same way; “popular” never was.'},
'1.3':{situation:'Jordan closes the shop most nights, and he’s been watching the latte count climb. Five lattes on the report feels like momentum. But Jordan recognizes faces: Maya (not the owner — a regular with the same name) comes in almost every day. He starts to suspect the “growth” is one loyal customer ordering twice inside the same fifteen orders, not five different people discovering the shop.', task:'His question is precise: “How many real people ordered each drink?” Real people means unique names. The task is to count customers per drink in a way where the same person ordering twice still counts once — because a business built on five strangers is different from a business built on four, and Jordan wants to know which one he’s working in.', action:'COUNT(*) counts rows — receipts. COUNT(DISTINCT customer_name) counts entities — people. Swapping one for the other is a one-word change in the query and a completely different question in the business. Run both against latte and watch 5 become 4.', result:'Latte reaches 4 distinct people, not 5: the regular ordered twice. Cold brew and espresso each reach 3 people; matcha only 2 — the drink that looked mid-tier on revenue is actually the narrowest audience on the menu. If Maya wants new faces, matcha is the sampling candidate, not the proven earner.', learning:'About the SQL: DISTINCT inside COUNT collapses duplicates before counting; without it, every aggregate quietly answers “how many rows” even when you asked “how many people.” About the business language: “customers” and “orders” are different units, and mixing them inflates every growth story. Naming the entity — people, not receipts — is analyst hygiene.'},
'1.4':{situation:'Repricing week. Maya is staring at the menu board wondering whether the drink ranking is hiding a size ranking inside it. A drink can win on one size and coast on another; a large cold brew and a medium cold brew are almost different products, with different margins and different customers. “Before I touch a single price,” she says, “break every drink down by size. Maybe the large is doing all the work.”', task:'The task is a finer cut of the same table: not one row per drink, but one row per drink-and-size combination. Count and sum inside each combination, then read the story drink by drink: within each drink, which size carries the money?', action:'GROUP BY takes two columns at once — GROUP BY drink, size — and the output grain changes from “one row per drink” to “one row per drink-size pair.” Nothing else in the query has to change; the aggregates do the same work inside smaller buckets. That’s the lesson hiding in the syntax: the GROUP BY list is where you declare what one row of your answer means.', result:'Latte is a medium story: $22.00 of its $28.50 comes from mediums. Cold brew is the opposite — a large story, $15.00 of $19.50. Espresso is small-only by design. So “reprice the drink” was the wrong unit; Maya reprices sizes: protect the medium latte, and test whether a large matcha can borrow cold brew’s trick.', learning:'About the SQL: adding a column to GROUP BY refines the grain of the output; every aggregate is then computed per combination. About the business language: blended averages hide the segment that matters. “The drink underperforms” and “the small underperforms” lead to different decisions — the finer grain is what lets you say the second one.'},
'2.1':{situation:'You post the same four videos everywhere, and the weekly numbers look like a success story: views climb on every platform, every week. And yet the comments feel thinner, the click-throughs to your channel feel rarer, and a sponsor who asked for “engagement” last month has gone quiet. The total says growth. Your gut says decay. Both can’t be the whole story — so which one is the data actually telling?', task:'The determined work is to stop reading reach and start reading pull. For every post, compute CTR — clicks divided by views — and lay each platform’s cumulative views next to it over time. Crucially, the posts themselves must stay visible as individual rows; collapsing them into platform totals would destroy the trend you’re hunting. That “keep the rows, add a calculation” shape is the signature of a window function.', action:'SUM(views) OVER (PARTITION BY platform ORDER BY posted_at) attaches a running total to each post without merging any posts together, and ROUND(100.0*clicks/views, 1) prices each post’s pull as a percentage. GROUP BY would have given you four numbers and no story; the window gives you every post, annotated, in sequence.', result:'There it is. TikTok’s CTR slides from 2.5% to 1.3% across the four posts while its view count more than doubles — the platform is showing the videos to more people who care less. YouTube’s CTR holds around 6%. The channel wasn’t growing and decaying at once; one platform was doing each, and the blended total hid both.', learning:'About the SQL: a window function computes across a set of related rows (the partition) and returns the value on every row; GROUP BY collapses those rows into one. About the business language: CTR separates distribution from resonance — “views are up” is a statement about the algorithm, “CTR is softening” is a statement about the audience, and they demand different fixes.'},
'2.2':{situation:'Your channel manager doesn’t want another totals chart. “I can see we ended higher than we started,” she says. “What I need to know is the shape: did each new video actually add anything, or are we riding one old hit? Show me what each post added over the one before it — per platform.” It’s a reasonable question that a totals table structurally cannot answer, because totals erase the steps between them.', task:'The work is row-to-previous-row comparison, inside each platform, in posted order. Each post needs to see the views of the post before it, on the same platform, and subtract. No new table, no export to a spreadsheet — the comparison has to happen inside the query, per partition, ordered by date.', action:'LAG(views) OVER (PARTITION BY platform ORDER BY posted_at) reaches one row back inside each platform’s timeline and places that earlier value beside the current one. views minus LAG(views) is the week-over-week change, computed for every post in a single pass. The first post of each platform gets NULL — there is no previous post, and the query honestly says so.', result:'Every platform’s steps are positive, but the shapes diverge. TikTok adds thousands of views per post; YouTube adds hundreds. One curve is a staircase, the other is a ramp — and the content strategy for “keep feeding the staircase” is different from “widen the ramp.” The manager gets her shape.', learning:'About the SQL: LAG and LEAD are window functions that shift values across rows — period-over-period math without self-joins. About the business language: growth is a sequence, not a total. “Up 4,100 views” closes a conversation; “each post added more than the last” starts the right one.'},
'2.3':{situation:'A sponsor emails with money on the table: “We’ll place our product in your top video — on each platform. Send us the #1 post per platform, with numbers.” Your biggest video overall is on TikTok by a mile, but that’s not what was asked. The sponsor is buying three leaderboards, not one, and “top” has to be proven inside each platform’s own audience, where a view doesn’t mean the same thing everywhere.', task:'The task is ranking inside groups: for each platform separately, order the posts by views and assign 1, 2, 3, 4. The ranking must restart at every platform boundary. It also has to survive scrutiny — if two posts ever tied, the sponsor would ask which ranking rule broke the tie, so the rule gets named before the query runs.', action:'RANK() OVER (PARTITION BY platform ORDER BY views DESC) builds a separate leaderboard per partition. And the tie rule matters: RANK shares a rank and then skips (1, 2, 2, 4), ROW_NUMBER never shares. Declaring which one you used is the difference between a ranking and an argument.', result:'One title sweeps it: “Window functions, simply” is the #1 post on YouTube, TikTok, and Instagram alike. The sponsor gets three proven winners instead of one big number, and you get a sentence that travels well in a pitch deck — the same piece of content wins in three different audiences.', learning:'About the SQL: partitioning a window restarts its calculation per group, so ranking, running totals, and row-to-row comparisons can all live inside one query. About the business language: “our top post” is meaningless until the leaderboard is defined. Top per platform, with the tie rule stated, is a claim a sponsor can verify — and pay for.'},
'2.4':{situation:'End of the month, and you have to choose where next month’s effort goes. You can seriously push one platform: more posts, better hooks, real attention. The obvious candidate is TikTok — it has five times YouTube’s views. But the sponsor who went quiet, and the thinning comments, keep nagging at you. Before you commit a month, you want one number per platform that measures audience quality instead of audience size.', task:'The task is an apples-to-apples CTR per platform: total clicks divided by total views across all posts on that platform. Not the average of the four percentages — an average would weight a 1,200-view post the same as a 19,900-view post. Sum the clicks, sum the views, divide once. Then rank the platforms by the result and let the ranking make the decision.', action:'GROUP BY platform with ROUND(100.0*SUM(clicks)/SUM(views), 1) does it in three lines. The 100.0 forces decimal math — in integer division, this ratio would collapse toward zero and the whole comparison would quietly rot. The query is simple; the discipline is in aggregating the ratio correctly.', result:'YouTube 6.1%. Instagram 4.3%. TikTok 1.7%. The platform with the most views converts worst by a factor of three and a half. Next month’s effort goes to YouTube — not because it’s biggest, but because its audience actually clicks. Reach was the vanity metric; pull was the decision metric.', learning:'About the SQL: ratios get aggregated as sums of their parts, never as averages of ratios; and casting to decimal before dividing protects every percentage you compute. About the business language: this is segmentation doing its job — the blended channel hid three different audiences, and the segment, not the blend, is what you allocate against.'},
'3.1':{situation:'Your little store has been running for a month, and the money is real — but it’s a soup. Customers arrived from Instagram, from TikTok, and from just finding you (organic). You know the total revenue. What you don’t know is which door the money walked through, or whether some door is bringing in window-shoppers who sign up, smile, and never buy a thing.', task:'The owner’s ask has two clauses, and the second one is the trap: “Break revenue down by where customers came from — and don’t lose anyone. I want to see the channels that brought people who never bought, too.” The work: join customers to their orders on customer_id, group by signup channel, count the people distinctly, sum what they spent — while keeping the zero-order customers inside the count.', action:'LEFT JOIN is the clause that honors “don’t lose anyone”: every customer survives the join, and those without orders carry NULLs instead of vanishing. COUNT(DISTINCT customer_id) is the second guardrail — Maya ordered twice, and a naive count after a one-to-many join would clone her (fan-out) and inflate the channel that “acquired” her.', result:'Organic quietly wins: 2 customers, $350 — the best revenue in the store with zero ad spend. Instagram brings 3 customers and $315; TikTok brings 3 and $245. And two people — Theo and Nia — signed up and bought nothing, visible only because the join refused to drop them. They’re not a rounding error; they’re a win-back list.', learning:'About the SQL: joins are only as trustworthy as your knowledge of the keys, and joining one-to-many multiplies rows — check your row count after every join. About the business language: “customers” after a join is a claim about DISTINCT people, and a channel’s value includes the people it brought who haven’t bought yet.'},
'3.2':{situation:'The blended number looks like a green light: $355 of ad spend, $910 of revenue, ROAS 2.56. “So we double the ads?” is the obvious next sentence, and it’s exactly the sentence that bankrupts small stores. Because ROAS is an average over two very different channels — and somewhere inside that average, one channel might be buying expensive customers who barely spend, while the other buys cheap customers who come back.', task:'The real task is to price a customer, per channel. CAC: what one acquired customer costs (channel spend ÷ customers acquired). Value per customer: what one is worth so far (channel revenue ÷ customers). “Acquired” means everyone who signed up through the channel, buyers or not — shrink that denominator to only buyers and CAC lies politely. Then compare the ratios channel by channel.', action:'A CTE earns its keep here: one named step builds per-channel customers and revenue (LEFT JOIN, so non-buyers stay in the count), another totals the spend, and the final select divides. CAC = spend ÷ acquired. Instagram: $240 ÷ 3 = $80. TikTok: $115 ÷ 3 = $38.33. The denominator is a decision, and the query makes it in writing.', result:'TikTok customers are cheaper and worth less: value $81.67 against Instagram’s $105. But the ratio flips the verdict — TikTok returns 2.1 dollars of value per dollar of acquisition cost; Instagram returns 1.3. Doubling “the ads” would double both ratios blindly. The budget move is to shift weight toward TikTok and fix Instagram’s cost, channel by channel.', learning:'About the SQL: WITH (a CTE) turns a multi-step calculation into named, debuggable steps — and every ratio’s denominator is a modeling choice the SQL makes visible. About the business language: ROAS is revenue per dollar, not profit per customer; LTV-to-CAC is the sentence that decides whether growth is healthy or just loud.'},
'3.3':{situation:'Eight people have signed up for your store. Six have bought something. Two are just… there — names in the customers table, silent since the day they arrived. They cost nothing to email and they already raised their hands once. Before you spend another dollar acquiring strangers, you want the simplest list in the business: who signed up and never ordered?', task:'The task is a negative: find rows defined by the absence of a match. Start from every customer, attach orders where they exist, and keep exactly the customers for whom no order exists. The answer should be short enough to paste into an email tool — two names, no spreadsheet archaeology.', action:'LEFT JOIN customers to orders, then filter WHERE o.order_id IS NULL. That pairing is the standard “no-match” pattern in SQL: the LEFT JOIN manufactures NULLs precisely where the relationship is missing, and the filter keeps only the manufactured gaps. An INNER JOIN could never answer this question — it deletes the very people you’re looking for before you start counting.', result:'Theo and Nia. Two names. Theo came in organically in late September; Nia arrived through TikTok and never bought. That’s the entire win-back campaign: two emails, written like they’re for two people, because they are.', learning:'About the SQL: absence is data. LEFT JOIN plus IS NULL turns “who has no…” into a first-class query, and IS NULL is the only honest way to test for a missing value. About the business language: a win-back list is a segment defined by what didn’t happen — and naming it precisely (“signed up, never ordered”) is what makes the outreach feel personal instead of automated.'},
'3.4':{situation:'Your bookkeeper is closing September and she’s allergic to your system, which is two tables and a shrug. “I don’t care that money-in lives in one table and money-out lives in another,” she says. “One timeline. Every dollar, in date order. That’s how I see whether the ads caused the sales or just happened near them.” She’s right, of course: causality has a chronology, and right now yours is split in half.', task:'The task is to stack two differently-shaped histories into one. Orders contribute date, direction “in,” amount. Ad spend contributes date, direction “out,” amount — minus the embarrassing $0 row that isn’t an event at all. The columns must line up exactly, the duplicates must survive (two $600 spends are two events, not a typo), and the result must read in date order.', action:'UNION ALL is the stacking clause: it appends one result set under the other without de-duplicating. Its sibling UNION would sort and dedupe — slower, and wrong here, because a repeated dollar amount is a real second dollar. The direction column is invented on the fly in each SELECT, which is the trick that makes two tables with different meanings share one timeline.', result:'One ledger, September in order: ad money going out in the first half of the month, order money answering through the second half. Theo’s zero-dollar spend row is gone because it never happened. The bookkeeper can finally see the shape of the month — spend precedes revenue, which is the whole argument for the ads, visible at a glance.', learning:'About the SQL: UNION/UNION ALL combine result sets vertically and demand aligned columns; choosing ALL vs not is choosing whether duplicates are noise or data. About the business language: finance reads chronologically. “ROAS 2.56” is a summary; a dated timeline is evidence, and evidence is what survives a bookkeeper.'},
'4.1':{situation:'The house spreadsheet says Sam paid less “on average,” and Sam has feelings about it. Two expense receipts got lost this month — one for cleaning, one for a household run — and they’re sitting in the table as blanks. Sam’s question is the right one: “Are you counting the lost receipts as zero? Or pretending those expenses never happened? Because those give different answers, and one of them makes me the house deadbeat.”', task:'The task is to make the invisible choice visible. Run three calculations on the same column side by side: the sum, the average as-is, and the average with missing values explicitly replaced by zero. Then count the rows. Whichever answer the house defends, it should be defending it on purpose, with the assumption printed inside the query instead of smuggled inside a spreadsheet default.', action:'Aggregates skip NULLs silently. SUM(amount) adds only the 8 known amounts; AVG(amount) divides by 8 even though 10 expenses happened — a lie of omission with correct arithmetic. COALESCE(amount, 0) forces a decision: every expense counts, missing ones as zero, stated in the SQL where a roommate can argue with it. COUNT(*) sits alongside as the witness: 10 rows went in.', result:'Three answers, all “correct”: $4,193.75 total; a $524.22 average over 8 expenses; a $419.38 average over all 10. Sam wasn’t underpaying — the average was undercounting. The house adopts the COALESCE version, not because it’s the kindest number, but because it’s the one whose assumption everyone can see.', learning:'About the SQL: NULL is a missing value, not zero — it propagates through math and is skipped by aggregates, and COUNT(column) skips it too while COUNT(*) doesn’t. About the business language: “average spend” is an argument waiting to happen until you name the denominator and the treatment of missing data. “Over 10 expenses, missing counted as zero” ends the argument.'},
'4.2':{situation:'Receipts settled, a bigger question remains: is the house actually sharing fairly month to month, or does one person carry the place while the others cover snacks? Maya fronts the rent — big, visible, monthly. Jordan and Sam pay a scatter of smaller bills. Memory says it “evens out.” Nobody has ever checked, and in a house, unchecked memory is how resentments get compound interest.', task:'The task is a per-person, per-month ledger: total paid by each roommate in each month, from the expenses table, with lost receipts treated as zero on purpose (last lesson’s rule, now house law). A roommate with a quiet month must still appear — a missing row would look like a missing roommate. And the month itself has to be carved out of the expense dates.', action:'strftime(’%Y-%m’, expense_date) is SQLite’s way of truncating a date to its month — other dialects say DATE_TRUNC, the idea is identical: bucket the timestamp, then group by bucket and person together. LEFT JOIN from roommates keeps everyone on the board; COALESCE inside SUM applies the house rule on missing receipts.', result:'The memory was wrong in an interesting direction. Maya carries both months on rent alone — $1,800 each — dwarfing everything else, while Jordan and Sam split the utilities and groceries that keep the house livable. It does not “even out”; it specializes. The house stops pretending otherwise and rebalances rent against the small bills on purpose.', learning:'About the SQL: truncating dates into month buckets and grouping by two dimensions (person × month) turns a pile of receipts into a ledger. About the business language: fairness claims need a grain. “We split things” at the house grain hides what “Maya pays $1,800 a month” at the roommate-month grain makes undeniable.'},
'4.3':{situation:'Jordan is looking at the payments table and it might as well be written in license plates: from_roommate 2, to_roommate 1, amount 600. “I know money moved,” he says. “Who paid whom? In names. I’m not Venmo-ing a primary key.” Fair. The IDs were designed for the database’s convenience, not for three humans trying to settle a house without a fight.', task:'The task is translation: every payment row references roommates twice — once as the sender, once as the receiver — and both references need to become names in the same output row. The payments themselves don’t change; the question is how many times one lookup table has to be consulted to read a single row out loud.', action:'Join roommates twice. The first join, aliased a, resolves from_roommate into a sender name; the second, aliased b, resolves to_roommate into a receiver name. Same table, two aliases, two roles. This is the self-join family: one table playing multiple parts in a single query, with aliases keeping the parts straight. (Where the “other roommates table” doesn’t exist, the table joins to itself outright — same trick, one table.)', result:'Five payments, fully human: Jordan → Maya $600, Sam → Maya $600, Sam → Jordan $47.50, then October’s rent round, Jordan → Maya and Sam → Maya again. Jordan can read the house’s entire money history aloud in one breath. Nobody Venmos a primary key.', learning:'About the SQL: a table can join as many times as it has roles; aliases are what let one table be sender and receiver simultaneously. About the business language: IDs are for machines and names are for agreements. Any report a human has to act on — or argue about — gets resolved to names before it leaves the query.'},
'4.4':{situation:'Before the house settles up, you want one clean fact: which expenses can’t be proven? Two amounts in the table are blank — receipts that never made it home. It would be easy to let those quietly become “someone underpaid.” It would also be exactly the kind of accusation that poisons a house, because nobody owes money on a number that doesn’t exist. First, find them. Then, find whose they are.', task:'The task is a query about absence. The expenses with lost receipts are defined by amount being NULL — not zero, not empty, missing. Attach the roommate’s name to each one, so the house knows who needs to reconstruct a number and who is completely off the hook. Two rows are expected; a third would mean the problem is bigger than anyone thought.', action:'amount = NULL never matches anything — NULL isn’t a value, so equality against it is meaningless. The test is IS NULL, and it’s the only honest one. Join expenses to roommates on paid_by so each missing receipt comes back wearing its owner’s name.', result:'Exactly two: Jordan’s cleaning and Sam’s household run. Maya’s record is complete; Jordan and Sam each owe the house one reconstructed receipt — not money, just proof. The accusation list is empty, because the missing list was checked first.', learning:'About the SQL: NULL is tested with IS NULL, never with =, and COUNT(amount) vs COUNT(*) differ precisely by these rows. About the business language: “unaccounted” and “unpaid” are different findings. Checking what’s missing before judging what’s owed is the whole ethic of working with incomplete data — in a house, or a company.'},
'5.1':{situation:'Sunday night, twenty applications deep. One offer, a handful of interviews, and a long tail of silence. You’re exhausted in the particular way that makes people say “I’m just bad at applying” — a global verdict that helps nothing. But is it true? Your applications live in a table with a stage column, and a stage column means the hunt has a shape: applied, screen, interview, offer, rejected. Somewhere in that shape, the mass of your effort is dying at one specific step.', task:'The task is to count the funnel honestly: applications per stage, and each stage as a share of all twenty. Not vibes — proportions. If most applications die before the screen, the fix is targeting and resume fit; if they die at interview, the fix is interview craft. The query has to produce the evidence that chooses between those two completely different next months.', action:'A CTE does the counting in a named first step — WITH funnel AS (…) — so the second step can divide each stage’s count by the total and present shares. Naming the intermediate result is what turns a nested, unreadable query into two sentences a tired person can verify at midnight: here are the counts; here is what they mean.', result:'Screen 6, rejected 5, still sitting at applied 4, interview 4, offer 1. The funnel breaks at the screen: fourteen of twenty never got past first contact, while the applications that did reach interview converted respectably. Volume was never the problem. Next month’s effort goes into role fit and the first impression — not into applying to forty more.', learning:'About the SQL: a CTE (WITH …) names a temporary result so a query reads top-to-bottom in the order you reasoned it; funnel math is just GROUP BY on a stage plus each group’s share. About the business language: “I’m bad at applying” is a blend. “The break is at the screen stage” names a stage, a metric, and a fix — that’s what a funnel is for.'},
'5.2':{situation:'Same resume, same effort, three different worlds. Startup applications keep turning into conversations; bigtech applications vanish into portals; agency applications are a coin flip you keep losing. You’re tempted to conclude something about yourself. But an older lesson from the coffee shop whispers: a blended number is usually segments behaving differently — and right now your whole hunt is one blended number.', task:'The task is to cut the funnel by segment: for startups, bigtech, and agencies separately, count the applications, count how many reached interview-or-better, and compute the rate. “Reached interview-or-better” doesn’t exist as a column — it has to be counted conditionally, inside each group, from the stage values. Rates, not raw counts, because the segments aren’t the same size.', action:'SUM(CASE WHEN stage IN (’interview’,’offer’) THEN 1 ELSE 0 END) counts a subset inside each GROUP BY segment — conditional aggregation, the same engine that powers pivoting. One query returns three little funnels side by side, and the interview question answers itself by comparison instead of by mood.', result:'Startups: 4 of 8 reach interview — 50%. Bigtech: 1 of 6, 16.7%. Agency: 0 of 6. It isn’t effort and it isn’t talent; it’s mix. Half of a warm segment beats all of a cold one. Next month’s application list tilts hard toward startups, and the bigtech portal applications get the smallest slice of the week.', learning:'About the SQL: CASE inside an aggregate counts or sums a filtered subset per group — the foundation of pivots and scorecards. About the business language: this is mix shift — the overall rate moved because the composition changed. “Is this a behavior problem or a mix problem?” is the question that keeps you from fixing the wrong thing.'},
'5.3':{situation:'It’s a mock interview, and the interviewer slides a query across the table: “This filters on the alias n inside WHERE, and it errors. Most candidates tell me it’s a syntax problem. It isn’t. Why does it error?” Your first instinct — it ran fine in your head — is exactly the trap. The query reads in the order SELECT, FROM, WHERE. SQL does not execute in the order it reads, and this question exists to find out whether you know the real order.', task:'The task is demonstration, not repair-first. Run the broken query and read the error literally: “no such column: n.” Then explain it from execution order — FROM, WHERE, GROUP BY, HAVING, SELECT, ORDER BY — and only then fix the query so it returns the stages with more than two applications. The fix matters less than the why; the interviewer is buying the why.', action:'At WHERE time, the alias n has not been born: aliases are created in SELECT, which executes fifth, after WHERE has already run second. Filtering on n in WHERE is addressing a letter that hasn’t been written. The repair restructures the work: a CTE computes stage and count first, and the outer query filters on the finished column. Same logic, legal order.', result:'The CTE version returns screen (6), rejected (5), applied (4), interview (4) — the stages above the threshold — and, more valuable than the rows, you can now answer the follow-up before it’s asked. Execution order stops being trivia and becomes the debugging instinct behind every “why did SQL do that?” moment.', learning:'About the SQL: SQL executes FROM → WHERE → GROUP BY → HAVING → SELECT → ORDER BY, which is why aliases can’t be filtered in WHERE and why clause order in your file isn’t execution order. About the business language: reciting this order calmly, while debugging out loud, is a trained-analyst signal. Interviewers aren’t testing the fact; they’re testing whether errors make you more precise or more flustered.'},
'5.4':{situation:'Look at the four companies that actually screened you and a pattern itches: the one that moved fastest is the one that made the offer. Coincidence? Maybe. But response speed felt like information the whole way through — fast replies read as enthusiasm, slow ones as a slow no. Your events table has both milestones for the applications that got screens: the day you applied and the day they called. The itch is testable.', task:'The task is duration: for each company that screened you, days from application to screen, fastest first. Each application’s two events live in the same table as separate rows, so the query has to pair an applied-row with its screen-row for the same application, subtract the dates, and rank. Five companies got screens; the Marlow offer is the hypothesis.', action:'The events table joins itself: one alias hunts event_type = ’applied’, the other event_type = ’screen’, matched on application_id. julianday(screen) minus julianday(applied) turns two timestamps into a duration in days — other dialects spell it DATEDIFF, the idea is portable. Cast it to a whole number and sort ascending: fastest first, hypothesis on top.', result:'Marlow screened in 4 days and offered. Verdant took 5, Kiteway 6, Northwind and Corelink 7. It’s five data points, not a law of nature — but the fastest mover made the only offer, and the two slowest never got past the interview. Speed was signal: about their enthusiasm, and maybe about fit. Next hunt, response time goes on the tracker as a column worth watching, not a feeling worth trusting.', learning:'About the SQL: self-joining an events table pairs milestones for the same entity, and date subtraction converts paired timestamps into durations — the basis of cycle-time and time-to-stage metrics everywhere. About the business language: “they got back to me fast” is an anecdote; “median days-to-screen was 6, and the offer came from the 4-day responder” is a metric. Durations turn impressions into evidence.'},
'0.1':{situation:'Day one. The shop’s entire history is a table of fifteen orders, and nobody has looked at it directly yet — every conversation so far has been memory and opinion. Before a single calculation gets trusted, someone has to do the least glamorous thing in data work: open the table and read it. Drink, size, price. Nothing else. The temptation is to start summarizing immediately; summaries of data you’ve never seen are just rumors with arithmetic.', task:'The task is deliberately small: return three columns for every order. No filtering (you don’t know what matters yet), no aggregation (you’d be averaging a thing you haven’t met). SELECT drink, size, price FROM orders — and then read, row by row, the way you’d read a receipt drawer.', action:'SELECT is the reading verb. Naming the columns instead of reaching for SELECT * is the first act of discipline: it declares what you care about and makes the output explain itself to the next person. Fifteen rows come back, one per order. The grain announces itself — one row is one order — and patterns surface before any math touches them: lattes repeat, espresso sits at the cheap end, matcha leans large.', result:'No decision gets made, and that’s the point. But the room now shares fifteen facts instead of five opinions, and every later query in this database inherits this moment: you know what a row is, what the values look like, and what “normal” is before anyone says the word “average.”', learning:'About the SQL: every query begins as reading — SELECT the columns, FROM the table. About the business language: “let me look at the data” is a complete, professional sentence. Analysts who skip it end up defending summaries of tables they never actually saw.'},
'0.2':{situation:'Jordan works the counter, and counter-knowledge is specific: he doesn’t care about “orders,” he cares about the latte people. One of them is in every day. So when the first summary work begins, his ask is the natural second step in all of data: “Just the lattes. Who’s buying them, and what are they paying?” Not the whole haystack — the needles he already suspects are there.', task:'The task is row selection: from fifteen orders, keep the ones where the drink is latte, and show who bought each and at what price. Five rows should survive. Text gets single quotes, because SQL treats unquoted words as column names — a small syntax rule with a loud error message when forgotten.', action:'WHERE is the filter clause, and it runs early: before any grouping, sorting, or math, every row is tested — is drink equal to ’latte’? — and only the yeses continue. SELECT customer_name, drink, price FROM orders WHERE drink = ’latte’ is three decisions in one breath: which facts, from where, under what condition.', result:'Five latte orders, four distinct humans, and there she is: Maya, twice, at $5.50 each. Jordan’s suspicion graduates from counter-lore to a query result. The shop’s latte business is partly one regular’s habit — a fact that will matter enormously when someone later counts “customers” by counting receipts.', learning:'About the SQL: WHERE filters rows with a yes/no condition, and it executes before GROUP BY ever sees the data. About the business language: “just the lattes” is a segment — every filter quietly defines the population you’re making claims about, and naming it (“among latte orders…”) keeps claims honest.'},
'0.3':{situation:'Maya is rethinking the top of the menu board, and she wants to see the ceiling: “What are the three most expensive orders we’ve actually sold?” Not the most common, not the average — the extreme, because the extreme is where pricing headroom lives. It’s a small ask with an ordering trap inside it: “three most expensive” is meaningless until the rows are sorted, and grabbing any three rows first would answer a question nobody asked.', task:'The task has a strict sequence: rank every order by price, highest first, and only then take three. Sort, then limit. Reverse the order of operations and you get three random orders wearing a “top 3” costume. The query must also carry the customer and drink along, because a price without a story is trivia.', action:'ORDER BY price DESC arranges the finished result from priciest to cheapest — DESC, descending, biggest first. LIMIT 3 then keeps the podium. Two clauses, executed in the order sorting-then-cutting even though your eyes meet them in the order written; this is the first place SQL teaches you that reading order and execution order are cousins, not twins.', result:'A $7.00 large matcha (Priya), a $6.50 large latte (Alex), a $6.00 medium matcha. Two of the top three are matcha, all three are medium-or-large: the menu’s ceiling is a big-drink ceiling. If Maya wants to test a premium tier, the data just told her where the headroom already lives.', learning:'About the SQL: ORDER BY + LIMIT is the universal “top N” pattern, and LIMIT without ORDER BY returns arbitrary rows. About the business language: “top three” is a ranking claim — it always owes the listener its criterion. “Top three by price” can be checked; “our best orders” cannot.'},
'1.5':{situation:'A week into the GROUP BY lessons, Maya asks the question every owner eventually asks, usually while staring out a window: “Forget drinks for a second. How is the shop doing — day to day? Are we growing?” The orders table can answer her, but only if the grain changes. Every query so far has sliced by drink; she’s now asking for the business sliced by time, and time answers differently than categories do.', task:'The task is to re-bucket the same fifteen orders by day: one row per date, orders counted, revenue summed, presented in calendar order so the eye can travel. Six days of shop life, six rows. The question sounds simple — “are we growing?” — and the honest answer will depend on whether a pattern survives being looked at, or dissolves into wobble.', action:'GROUP BY ordered_at does to dates what GROUP BY drink did to drinks: collapses each day’s orders into one row with aggregates inside. ORDER BY ordered_at (not by revenue) keeps time’s arrow intact — sorting a trend by size would scramble the story into a ranking, which is a different and lesser thing.', result:'$10.50, $15.00, $17.50, $9.00, $17.00, $8.50. A spike on Oct 3, a collapse on Oct 6, no staircase anywhere. The analysis is the discipline to say it plainly: six days is weather, not a trend. Maya doesn’t get the growth story she wanted; she gets something more valuable — knowing she doesn’t have one yet, and how many more days of data would change that.', learning:'About the SQL: grouping by a date column converts a table into a time series — same machinery, time-shaped grain. About the business language: “trend” is a claim about direction over enough points; naming the window (“over six days”) and refusing the word when the data is thin is what separates an analyst from a narrator.'},
'2.5':{situation:'The newest YouTube video is eating the channel. Not in a bad way — in a lopsided way. Views are healthy in total, but you can feel the catalog thinning behind the latest upload, and a quiet question forms that totals can’t answer: how much of this channel is one video? If the answer is “most of it,” the channel isn’t a library; it’s a single point of failure with good numbers.', task:'The task is share, not size: for each YouTube post, views as a percentage of YouTube’s total views. Every post must keep its own row (the catalog is the subject), yet every row needs the same denominator — the platform total — sitting beside it. That shape, detail plus group total in one result, is exactly what GROUP BY refuses to give you, because grouping would erase the posts.', action:'SUM(views) OVER (PARTITION BY platform) computes YouTube’s 8,550 total once and attaches it to all four rows; each post then divides its own views by the shared total. WHERE platform = ’YouTube’ narrows the stage first. The window function is doing double duty: aggregate and annotation in a single clause.', result:'14.0%, 21.6%, 28.1%, 36.3%. Each video has outperformed the last — a great story — and the newest alone is over a third of the channel. Both readings are true at once: momentum is real, and concentration is risk. The next series gets planned as a deliberate second pillar instead of a victory lap.', learning:'About the SQL: percent-of-total is a division between a row value and a windowed group total; the partition keeps the groups separate while the rows stay whole. About the business language: “share” reframes success as dependence. “Our top video is 36% of views” starts a strategy conversation that “views are up” never will.'},
'3.5':{situation:'Every store has folklore about its best customers, and yours has congealed into a sentence: “Alex spends a lot.” A lot compared to what? Compared to Sam? To the average? Folklore never specifies its denominator, which is why it survives every meeting. You decide to give “big spender” a definition it can be tested against: total spend above the average customer’s total spend. The average has to come from the same data, or the comparison is rigged from the start.', task:'Two computations, nested. First, per-customer lifetime totals — one number for each of the six customers who ever bought. Second, the average of those six numbers ($151.67), computed inside the query itself so the benchmark is born from the same table it judges. Then keep the customers who clear it, biggest first.', action:'The CTE named t holds the per-customer totals; the subquery (SELECT AVG(total) FROM t) reaches back into that step and returns the single benchmark value; the outer WHERE compares each customer against it. This layering is the point: a threshold computed by hand and typed in as 151.67 would rot the moment a seventh customer buys something. Computed inline, it can’t rot.', result:'Alex, $350. Sam, $210. Nobody else clears $151.67 — Priya sits at $35, Rin at $130. Two customers account for $560 of the store’s $910. “Alex spends a lot” is now “two of six customers beat the average, and one carries 38% of revenue”: the folklore, made falsifiable, turns into a retention priority and a concentration warning in the same breath.', learning:'About the SQL: a subquery is a query whose result feeds another — perfect for benchmarks, thresholds, and “compared to the average” questions. About the business language: every comparative adjective owes a denominator. “Above the average customer’s $151.67” can be audited; “big spender” can only be repeated.'},
'4.5':{situation:'It ends the way all house money stories end: at the kitchen table, with three versions of fairness. Maya fronted two rents — surely she’s ahead. Jordan paid a mountain of small bills and sent two $600 payments — surely he is. Sam has receipts and grievances in equal measure. Memory cannot settle this, because the money moved through three different flows (expenses fronted, payments sent, payments received), and no human holds all three ledgers in their head at once.', task:'The task is netting. For each roommate: everything they fronted for the house (missing receipts counted as zero — the rule the house already ratified), plus every payment they sent, minus every payment they received. That single signed number, net borne, is what each person has truly carried. Fair share for reference: $4,193.75 split three ways is about $1,397.92.', action:'Three CTEs, three flows: paid (expenses per person), sent (payments out), recv (payments in). The final select joins all three onto the roommate list — LEFT JOINs, so a person missing from any flow shows up with zeros instead of disappearing — and COALESCE wraps every seam, because one NULL in the arithmetic would NULL out an entire roommate. Complexity, but composed: each step small enough to verify, combined in reading order.', result:'Jordan has borne the most: $1,505.30. Sam: $1,428.45. Maya — the rent-fronter, the obvious “ahead” candidate — has borne the least: $1,260.00, because $2,400 flowed back to her. Against the ~$1,397.92 fair share, the table settles itself: Sam owes Jordan about $107, Maya owes about $138, and the house argument ends with arithmetic where the adjectives used to be.', learning:'About the SQL: real questions compose — named CTE steps for each flow, combined once; and COALESCE at every join seam is what keeps missing pieces from poisoning totals. About the business language: “net” is the grown-up form of every money argument. Gross claims (“I paid the rent!”) start fights; net positions, with the flows named, end them.'},
'5.5':{situation:'Monday morning. Twenty applications are out in the world, and they are not all equally alive. Some became screens and interviews — those have their own momentum. But a few went out the door and into silence, and silence compounds: every week an unanswered application sits, it looks less like a pending decision and more like a dead one. You don’t need motivation this morning. You need a list, ordered by who has waited longest, so follow-up effort lands where time has done the most damage.', task:'The task is aging. Filter the tracker to applications still at the applied stage — no screen, no rejection, just waiting. Measure each one’s age against a fixed as-of date, Sep 30, 2026, the freshest date in the data, so anyone re-running this gets the same numbers. Rank longest-first: the output order is the work order.', action:'WHERE stage = ’applied’ isolates the waiting; julianday(’2026-09-30’) minus julianday(applied_date) converts two dates into a duration in days; CAST makes it a whole number a human can say; ORDER BY days_waiting DESC puts the stalest application at the top of the list where it belongs. Nothing exotic — the craft is in the as-of date being chosen, stated, and defensible.', result:'Umbra, 12 days. Loomly, 11. Ostro, 5. Tandem, 1. Four follow-ups in the order they’re owed — two of them genuinely stale, one merely young. The Monday task writes itself, and it isn’t “apply to more”; it’s “revive the two oldest conversations before opening new ones.”', learning:'About the SQL: durations are date subtraction against a stated as-of point; filtering on stage plus sorting by age turns a tracker into a work queue. About the business language: “gone quiet” is a feeling until it has days attached. “Twelve days at the applied stage” triages itself — aging is how pipelines tell you where to stand.'}
};

// Trimmed 2026-10-08 (Quinton): basics stay lean — a story as long as the

'0.1':{situation:'Day one. Maya asked you to get acquainted with the general impression of the orders — what drinks and sizes are actually selling, before anyone starts summarizing them.', task:'SELECT drink, size, price FROM orders. Every order, three facts. No filtering, no math yet — you’re looking, not concluding.', action:'SELECT names the columns; FROM names the table. Fifteen rows come back, one per order. That one-row-per-order fact is the grain — say it out loud, because every later query assumes it.', result:'The shape is already visible: lattes repeat, espresso is the cheap one, matcha runs large. Nothing analyzed, but nothing is a mystery either.', learning:'About the SQL: SELECT reads columns from a table. About the business language: “let me look at the data” is a complete, professional sentence — and it comes before every summary worth trusting.'},
'0.2':{situation:'Jordan works the counter and cares about one thing: the latte people. “Just the lattes — who’s buying them, and what are they paying?”', task:'From orders, keep only the rows where drink is latte, and show customer, drink, price. Five rows should survive. Text values take single quotes.', action:'WHERE tests every row and keeps the yeses. SELECT customer_name, drink, price FROM orders WHERE drink = ’latte’ — three decisions in one breath: which facts, from where, under what condition.', result:'Five latte orders from four people, and there she is: Maya, twice, at $5.50. Jordan’s suspected regular is real — she was sitting in the table the whole time, waiting for a filter.', learning:'About the SQL: WHERE filters rows before any grouping, sorting, or math happens. About the business language: a filter defines the population a claim is about — “among latte orders…” is what keeps a claim honest.'},
'0.3':{situation:'Maya is rethinking the top of the menu board: “What are the three most expensive orders we’ve sold?”', task:'Rank every order by price, highest first, then take three. Sort before you limit — limiting first would return three random orders wearing a “top 3” costume.', action:'ORDER BY price DESC sorts biggest first; LIMIT 3 keeps the podium. Two clauses, one mandatory sequence — this pair answers every “top N” question you will ever meet.', result:'A $7.00 large matcha, a $6.50 large latte, a $6.00 medium matcha. Two of the top three are matcha, all three are medium or large — the top of this menu is a big-drink story.', learning:'About the SQL: ORDER BY sorts the result, LIMIT truncates it, DESC means descending. About the business language: “top three” always owes a criterion. “Top three by price” can be checked; “our best orders” cannot.'},
'1.2':{situation:'The revenue ranking did its job — Maya knows latte carries the shop. But a chalkboard has room for two featured drinks, and “the full ranking” isn’t a decision. Staff keep pitching favorites: matcha is photogenic, espresso is classic, cold brew is trending. Everyone points at a different drink.', task:'Maya cuts through it with a rule instead of a debate: “Only show me drinks that have already proven they can sell — four orders or more.” The condition is about a group total, not a single row: group first, count, then keep the groups that clear the bar.', action:'HAVING filters groups after GROUP BY, when each drink has become one row with its count attached. WHERE can’t judge COUNT(*) — it runs before the total exists. HAVING keeps latte (5) and cold brew (4); matcha and espresso (3 each) fall away.', result:'The promotion list writes itself: two drinks, both proven. Matcha and espresso aren’t banned — they’re unfeatured until they earn a fourth order. The chalkboard argument ended with a threshold instead of a taste contest.', learning:'About the SQL: WHERE filters rows before grouping; HAVING filters groups after aggregation. About the business language: “proven seller” means nothing until a number is attached — “four or more orders” is a rule the whole staff applies the same way.'},
'1.3':{situation:'Jordan closes most nights, and he’s been watching the latte count: five lattes on the report feels like momentum. But Jordan recognizes faces, and he’s pretty sure two of those five receipts are the same person. If the “crowd” is partly one regular, the growth story is smaller — and more fragile — than the order count claims.', task:'Count people, not receipts: per drink, distinct customers instead of total orders. Matcha deserves attention here — it looked level with espresso at 3 orders each; the people-count may tell a different story.', action:'COUNT(DISTINCT customer_name) counts each name once per group however many receipts it appears on. The totals don’t move (GROUP BY is untouched); only what’s being counted changes — from events to humans.', result:'Latte narrows from 5 orders to 4 people; cold brew 4 to 3; espresso holds at 3; matcha drops from 3 orders to just 2 people — one fan ordering twice. Matcha’s “demand” was partly one person’s loyalty. Order count measures transactions; distinct count measures audience, and the two disagree exactly where it matters.', learning:'About the SQL: DISTINCT inside COUNT collapses duplicates within the group before counting. About the business language: “orders” and “customers” are different metrics. Reports that blur them turn one fan into a crowd.'},
'1.4':{situation:'Repricing week. Maya is staring at the menu board, wondering whether the drink ranking hides a size ranking inside it. A drink can win on one size and coast on another; if large cold brews quietly out-earn everything, the menu should know. The one-level ranking from 1.1 is about to get a second dimension.', task:'Break revenue down by drink and size together — every drink×size combination gets its own row: orders counted, revenue summed. Expect more rows than 1.1: four drinks, up to three sizes each, but only combinations that actually sold.', action:'GROUP BY drink, size forms a group per combination — the grain gets finer. Same clause, longer list: each added column multiplies the groups, and reading the output means naming both keys (“large cold brews,” not just “cold brew”). Medium latte, 4 orders and $22.00, stays the workhorse row.', result:'Cold brew splits into a $15.00 large business (3 orders) plus one medium; matcha’s money is medium-led ($12.00 of $19.00); espresso is small-only, three orders, $10.50 — consistent and capped. Pricing insight: cold brew’s premium size is where its margin story lives.', learning:'About the SQL: each column added to GROUP BY refines the grain; aggregates then describe intersections, not categories. About the business language: averages hide structure — “cold brew earns $19.50” is true and useless; “large cold brew earns $15.00 of it” is actionable.'},
'1.5':{situation:'A week in, Maya asks the owner’s question: “Forget drinks — how is the shop doing day to day? Are we growing?” The table can answer, but only at a new grain: the business sliced by time instead of by drink.', task:'One row per day: orders counted, revenue summed, in calendar order so the trend reads left to right. Six days, six rows — then the discipline to say what six rows can and cannot prove.', action:'GROUP BY ordered_at does to dates what GROUP BY drink did to drinks. ORDER BY ordered_at keeps time’s arrow intact — sorting a trend by revenue would scramble it into a ranking, a different and lesser thing.', result:'$10.50, $15.00, $17.50, $9.00, $17.00, $8.50. A spike on Oct 3, a dip on Oct 6, no staircase anywhere. The honest read: six days is weather, not a trend. Maya doesn’t get a growth story — she gets knowing she doesn’t have one yet, and how much more data would change that.', learning:'About the SQL: grouping by a date column turns a table into a time series — same machinery, time-shaped grain. About the business language: “trend” claims direction over enough points; naming the window (“over six days”) and refusing the word when data is thin is what separates an analyst from a narrator.'}
