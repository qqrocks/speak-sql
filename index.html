Object.assign(STORIES, {
'0.1':{situation:'First day helping out at the shop. Maya just wants you to get a feel for the place. "Get acquainted with the orders. What drinks and sizes are we actually selling?" No agenda yet. She wants eyes on the data before anyone starts having opinions about it.', task:'Pull up drink, size, and price for every order. All fifteen of them. Nothing filtered out, nothing totaled up. Looking comes first.', action:'SELECT names the columns you want, FROM names the table. Simple as that. The rows come back one per order, and that little fact is worth saying out loud: one row is one order. Every query after this one quietly depends on it.', result:'You can already see the personality of the shop. Lattes keep showing up. Espresso is the cheap one. Matcha tends to be large. Nothing has been proven yet, but nothing is a total mystery anymore either.', learning:'About the SQL: SELECT is how you read. Pick the columns, name the table, look at what comes back. About the business language: "let me look at the data first" is a complete professional sentence. People who skip it end up defending summaries of tables they never actually saw.'},
'0.2':{situation:'Jordan works the counter, and counter people notice things. He keeps saying the same few faces order lattes. So his question is small and specific: "Just the lattes. Who is buying them, and what are they paying?"', task:'Start with all fifteen orders and keep only the latte rows. Show the customer, the drink, and the price. There should be five survivors.', action:'WHERE is a bouncer. It checks every row, asks one yes or no question (is the drink a latte?), and only lets the yeses through. One detail matters: text goes in single quotes, because SQL reads bare words as column names.', result:'Five latte orders, four different people. And there she is. Maya, not the owner, a regular, twice at $5.50 a visit. Jordan was right, and now it is not just counter instinct. It is in the data.', learning:'About the SQL: WHERE filters rows before anything else happens. No grouping, no sorting, no math until the bouncer has done his pass. About the business language: a filter quietly decides what your claim is about. "Among latte orders" is honest. "People love lattes" is a stretch.'},
'0.3':{situation:'Maya is redoing the menu board and thinking about prices. She wants to see the top end. "What are the three most expensive orders we have actually sold?" Not the most common. The ceiling.', task:'Rank every order by price, most expensive first, then take the top three. Order matters here. If you grab three rows first and sort later, you have three random orders and a question nobody asked.', action:'ORDER BY price DESC lines everything up from priciest to cheapest. DESC just means descending, biggest first. Then LIMIT 3 keeps the podium. Sort first, cut second. That pair of clauses is every top-whatever question you will ever meet.', result:'A $7.00 large matcha from Priya. A $6.50 large latte from Alex. Then a $6.00 medium matcha. Two of the three are matcha, and all three are medium or large. The top of this menu is a big drink story, and Maya can price accordingly.', learning:'About the SQL: ORDER BY sorts, LIMIT trims, and the sequence is non-negotiable. About the business language: "top three" always owes you its yardstick. Top three by price can be checked. "Our best orders" just sounds nice.'},
'1.1':{situation:'The shop has been open six weeks. Maya, the owner, has a chalkboard menu, a tip jar, and a feeling she cannot shake: the drinks are not equal. "Some of these carry us and some just take up chalk. Which ones actually make the money?" Feelings are not a plan, so she asks for numbers before she changes a single price.', task:'Add up what each drink earned across all fifteen orders, and count how many of each were sold. Revenue per drink, biggest first. One row per drink, so she can point at the board and say: this one first, this one last.', action:'GROUP BY drink sorts the orders into buckets, one bucket per drink. COUNT tallies each bucket, SUM adds up its prices, ROUND keeps the money tidy at two decimals, and ORDER BY revenue DESC puts the moneymaker on top where it belongs.', result:'Latte carries the shop. Five orders, $28.50. Espresso and matcha sell the same number of drinks, three each, but matcha brings in $19.00 and espresso only $10.50. Same popularity, very different value. Maya was right to ask before touching a price.', learning:'About the SQL: GROUP BY collapses a pile of rows into one row per group, and aggregate functions like SUM and COUNT do one calculation inside each group. About the business language: "popular" and "profitable" are different words. A quick order count will fool you. Revenue per group rarely does.'},
'1.2':{situation:'The revenue ranking did its job. Maya knows latte carries the shop now. But the chalkboard has room to feature maybe two drinks, and a full ranking is not a decision. Meanwhile the staff have opinions. Matcha photographs beautifully. Espresso is a classic. Cold brew is trending. Everybody is pointing at a different drink.', task:'Maya settles it with a rule: only drinks with a track record get featured. Four orders or more. Your job is to take the grouped result from 1.1 and keep the groups that clear the bar. The tricky part: the condition is about a group total, not about any single row.', action:'This is what HAVING exists for. WHERE runs too early, before the groups exist, so it cannot judge a count that has not happened yet. HAVING runs after GROUP BY, when every drink is one row with its order count attached, and it keeps the ones at four or more.', result:'Latte with five, cold brew with four. That is the feature board. Matcha and espresso are not banished, they are just not promoted until they earn a fourth order. The chalkboard argument ended, not with taste, but with a number everyone could point at.', learning:'About the SQL: WHERE filters rows before grouping. HAVING filters groups after. Timing is the whole difference. About the business language: "proven seller" means nothing until you attach a number to it. "Four orders or more" is a rule the whole staff can apply the same way on a busy Saturday.'},
'1.3':{situation:'Jordan closes most nights, and he has been watching that latte count climb. Five lattes feels like momentum. But Jordan knows faces, and he is fairly sure the same person is hiding inside those five receipts. If the crowd is partly one loyal regular, the growth story gets smaller, and a lot more fragile.', task:'Count people instead of receipts. For each drink, how many different customers bought it? Matcha is the one to watch. It tied espresso at three orders apiece, and the people count might break that tie in an embarrassing way.', action:'COUNT(DISTINCT customer_name) counts each name once per drink, no matter how many receipts have it. The grouping stays identical. Only what gets counted changes, from events to humans.', result:'Latte narrows to four people. Cold brew, three. Espresso holds at three. And matcha drops to two people: one fan ordering twice. Orders measure transactions. People measure audience. On matcha, those two numbers were quietly disagreeing the whole time.', learning:'About the SQL: DISTINCT inside COUNT removes duplicates before counting. About the business language: orders and customers are not the same metric, and reports that blur them turn one fan into a crowd. Always ask which one you are looking at.'},
'1.4':{situation:'It is repricing week, and Maya has a suspicion. The drink ranking might be hiding a size ranking inside it. A drink can win because everybody buys the large, or coast on one popular size while the rest of its sizes do nothing. She wants the board unstacked.', task:'Split the results by drink and size together. Every combination that actually sold gets its own row: how many orders, how much money. Expect more rows than before, and expect a couple of surprises.', action:'GROUP BY drink, size makes a bucket for every pair. Same clause, finer grain. Reading it takes one new habit: name both keys when you talk about a row. "Large cold brews" is a finding. Just "cold brew" is back to blur.', result:'Cold brew is a large drink business: $15.00 of its $19.50 comes from larges. Matcha leans medium, $12.00 of $19.00. Espresso is small only, three orders, $10.50, steady and capped. And medium latte, quiet through this whole series, is the single biggest row at $22.00.', learning:'About the SQL: every column you add to GROUP BY refines the grain, and the aggregates describe the intersections. About the business language: totals hide structure. "Cold brew earns $19.50" is true and useless. "Large cold brew earns most of it" tells you what to do next.'},
'1.5':{situation:'A week in, Maya asks the question every owner asks eventually, usually while restocking something. "Forget drinks for a second. How is the shop doing, day to day? Are we growing?" Same table, new grain. This time we slice the business by time.', task:'One row per day. Orders counted, revenue added up, laid out in date order so your eye can travel. Six days, six rows. Then comes the hard part: saying honestly what six days can and cannot prove.', action:'GROUP BY ordered_at does to dates what GROUP BY drink did to drinks. Keep ORDER BY on the date, not the revenue. Sorting a trend by size scrambles it into a ranking, and a ranking is not a trend, it is just a list with confidence.', result:'$10.50, $15.00, $17.50, then $9.00, $17.00, $8.50. A spike on October 3rd, a sag on the 6th, no staircase anywhere. So the honest answer is: six days is weather, not a trend. Maya did not get the growth story she wanted. She got something better, which is knowing she does not have one yet.', learning:'About the SQL: grouping by a date turns a table into a time series. Same machinery, time-shaped grain. About the business language: "trend" is a claim about direction over enough points. Naming your window, "over six days", and refusing the word when the data is thin is most of what separates an analyst from a storyteller.'},
'2.1':{situation:'Monday morning, analytics open, coffee number two. Your channel has twelve posts across three platforms, and the view counts are all over the place. TikTok has the huge number, 21,000 on one video. Raw views are flattering, though. What you actually want to know is whether people stick around, and whether this week is beating last week.', task:'For YouTube, work out each post\'s click-through rate, views divided by impressions as a percentage. Then, next to every post, keep a running total of views up to that day. One extra column so "are we accumulating?" answers itself.', action:'A plain GROUP BY would crush your four YouTube posts into one row, and the posts are the whole point. SUM(views) OVER (ORDER BY posted_at) counts beside each row instead, a total that grows as the rows go by. Rates and running totals, side by side, nothing collapsed.', result:'Click-through climbs all month: 4.7%, then 5.5%, 6.6%, 7.4%. The running total marches 1,200 up to 8,550. Whatever you changed about titles and thumbnails in week two, it worked, and now you know which line proves it.', learning:'About the SQL: a window function calculates across rows while keeping the rows. About the business language: a rate like CTR travels between posts of any size. A raw total only brags. When someone leads with the biggest number in the room, ask what it divides by.'},
'2.2':{situation:'Your producer brain loves growth percentages because they make slides. "Fifty-five percent growth!" sounds amazing right up until someone asks: off what base? This week you want the honest version. Each post next to the one before it, same platform, no funny business.', task:'For every post, show last post\'s views on the same platform, and the percent change from that post to this one. Watch the newest TikTok. A big drop wearing a growth costume is still a drop.', action:'LAG(views) OVER (PARTITION BY platform ORDER BY posted_at) reaches one row backward inside each platform and brings its views along. PARTITION BY restarts the trick per platform, so YouTube never borrows TikTok\'s yesterday. The percent change is just new minus old, divided by old.', result:'TikTok tells the truth in four rows: up 36%, up 31%, up 14%, then down over 21% to 6,200 while impressions ballooned. The algorithm showed it to more people and fewer of them cared. The headline number hid that. The lag column could not.', learning:'About the SQL: LAG and LEAD peek at neighboring rows without collapsing anything. About the business language: percent change is meaningless without its base. "Down 21% from 7,900" is a conversation. "55% growth" is a screensaver.'},
'2.3':{situation:'Your editor wants proof, not vibes. "Give me your best post on each platform. One per platform, and I want to see where it ranks." Awards are easy to claim and hard to show. Today we make the podium real.', task:'Rank posts inside each platform by views, best at the top. Keep the top three per platform, ties included, because two posts dead-heated for third and dropping one would be a lie by omission.', action:'RANK() OVER (PARTITION BY platform ORDER BY views DESC) medals the rows inside each platform separately. RANK is the honest referee: tied rows share a rank, and the next rank skips ahead. Putting the window in a CTE lets you filter on the rank afterward, which windows themselves will not allow.', result:'Every platform crowns a different winner, and YouTube\'s newest post takes its crown at 3,100 views. The editor gets a podium with the scores printed under it. No vibes were harmed, or used.', learning:'About the SQL: RANK gives position inside a group, and shared ranks for ties. About the business language: "our best post" is a ranking claim, and ranking claims owe receipts. "Ranked first of four by views" can be checked in ten seconds.'},
'2.4':{situation:'End of the month. Money meeting. The question on the table is unglamorous and total: which platform actually works? Views you have. What you need is the click rate by platform, all of them, side by side, nothing collapsed and nothing cherry-picked.', task:'Add up impressions and clicks per platform, then divide. One row per platform. This is the grain the money question wants, and it is finally a job for a plain GROUP BY.', action:'GROUP BY platform, SUM both columns, and let the division happen after the sums, not before. Rate of sums, not average of rates. That ordering is the entire lesson hiding inside this one.', result:'YouTube 6.1%, Instagram 4.3%, TikTok 1.7%. Smallest audience, best rate. The 21,000-view giant sits at the bottom of the table that matters. That is a budget conversation now, not a debate, and you are the person who brought the table.', learning:'About the SQL: aggregate first, divide second; rates of sums are the honest rates. About the business language: CTR, click-through rate, is just clicks divided by impressions said out loud. Naming the metric plainly is a credibility move. It tells the room you know what the number is made of.'},
'2.5':{situation:'You can feel it before you can prove it. The newest YouTube video is carrying the channel, and the older ones are getting quiet. Totals look healthy, which is exactly why nobody is worried. You are. If one video is most of the channel, the channel is a single point of failure with good numbers.', task:'For each YouTube post, show its share: its views as a percentage of all YouTube views. Every post keeps its row, because the catalog is the subject. Every row also needs the same denominator next to it.', action:'SUM(views) OVER (PARTITION BY platform) works out YouTube\'s 8,550 total once and pins it beside all four posts. Then each post divides its own views by that shared number. A GROUP BY could never do this; it would eat the posts to make the total.', result:'14.0%, 21.6%, 28.1%, 36.3%. Every video beat the one before it, which is a great story. The newest one alone is over a third of the channel, which is a risk story. Both are true. The next series gets planned as a second pillar instead of a victory lap.', learning:'About the SQL: percent of total is a row value divided by a windowed group total. About the business language: share reframes success as dependence. "Views are up" ends conversations. "One video is 36% of our views" starts the right one.'},
'3.1':{situation:'End of the month at the store. Revenue looks decent, ads look busy, and the bank account looks unimpressed. Somewhere between the sales and the spending, money is leaking. You want one timeline with both directions of money on it, refunds handled like the negative numbers they are.', task:'Stack the money-in rows and the money-out rows into a single dated list, refunds as negatives. Then total each kind. Every other lesson in this store spends money. This one finds out where it went.', action:'UNION ALL piles two result sets into one list, keeping every row, duplicates and all. That ALL is doing quiet work: UNION would deduplicate, and two identical $40 ad charges on different days are not duplicates, they are two charges. A small CASE labels each row so the pile stays readable.', result:'$910 in, $355 out, $555 kept. The store is healthy and the mystery is solved: no leak, just ad spend doing exactly what ad spend does. Next question is whether those ads earned their keep, which is a different and better argument.', learning:'About the SQL: UNION ALL stacks compatible result sets and keeps every row. About the business language: net means in minus out, and gross is not net no matter how good it feels. Say which one you mean, every time.'},
'3.2':{situation:'Six customers bought from the store. Fourteen of your ad clicks produced people who never bought anything, and in the current report they are invisible. That invisibility is flattering your numbers. Today the ghosts get counted.', task:'For each ad channel, list every customer it brought in, buyers and non-buyers side by side, with what each buyer spent. The people who spent nothing still get a row. Zeros are data too.', action:'Customers on the left, orders joining from the right. LEFT JOIN keeps every customer and lets the order columns come back NULL when there is nothing to show. Flip it to an inner join and the non-buyers vanish, taking your real conversion story with them.', result:'Fourteen quiet rows appear, each spending exactly nothing. Instagram brought three buyers. Organic brought two customers and not one ad dollar. The channel report finally shows the whole funnel, including the part that used to be edited out by the join itself.', learning:'About the SQL: LEFT JOIN keeps all rows from the left table; missing matches arrive as NULL. About the business language: a buyers-only report is survivorship bias with a dashboard. The denominator is the people who did not buy, and it is most of the story.'},
'3.3':{situation:'The ad platforms are arguing, the way platforms do. Instagram says it is premium. TikTok says it is efficient. Both are technically telling the truth, which is why you need one table where the argument ends: cost to acquire a customer, and what that customer ends up being worth, per channel.', task:'Per channel: ad spend divided by customers acquired, that is CAC. And average order value per buyer, your working LTV. Put them side by side. This is 3.2\'s ghost lesson coming home: the acquisition count includes non-buyers, or the math flatters Instagram.', action:'Aggregate ads and customers separately first, then divide. CAC is spend over everyone the channel acquired. LTV is what buyers from that channel actually spent. Two CTEs, one division each, no row multiplied by accident because the pieces were counted at their own grain first.', result:'Instagram acquires at $80 and returns $105 a customer, a 1.3 ratio. TikTok acquires at $38.33 and returns $81.67, a 2.1 ratio. Instagram is not bad. It is expensive. TikTok is quietly winning the only argument that matters, which is value per dollar.', learning:'About the SQL: count at the right grain before you divide, or joins multiply your numbers in the dark. About the business language: CAC is cost per acquired customer; LTV is what a customer is worth. Their ratio is the whole ad strategy in one number, and it only works with the honest denominator.'},
'3.4':{situation:'You keep saying "our best customers" in planning meetings, and it has started to bother you, because nobody has defined it. Best how? Most orders? Most money? Weirdest cart? Today the phrase gets a definition it can be graded against.', task:'Rank customers by lifetime spend, biggest first, and keep the top two. Also count their orders, so "best" gets checked against "frequent" before anyone engraves a plaque.', action:'Aggregate orders per customer first: total spend, order count. Then ORDER BY the spend descending and LIMIT 2. The podium again, same clauses from the coffee shop, now with names attached.', result:'Alex, $350 across two orders. Sam, $210 across four. Together they are $560 of the store\'s $910. Sam buys more often. Alex buys bigger. "Best" turned out to be two different people depending on the yardstick, which is exactly why the yardstick had to be said out loud.', learning:'About the SQL: aggregate, then rank, then limit. The top-N pattern changes clothes but never shape. About the business language: any "best" claim is a ranking claim plus a criterion. Spend the criterion out loud and the argument mostly ends.'},
'3.5':{situation:'Store folklore says "Alex spends a lot." Maybe. A lot compared to whom? Folklore never names its comparison, which is why it survives every meeting. You decide to give "big spender" a benchmark it can fail: above the average customer\'s total spend.', task:'Two calculations, nested. First, each customer\'s lifetime total. Second, the average of those totals, worked out inside the query itself. Then keep whoever clears it. If the benchmark comes from the same data, the comparison is fair by construction.', action:'The CTE holds the six customer totals. The subquery, SELECT AVG(total) FROM t, reaches back and returns one number: $151.67. The outer query compares each customer against it. Typed in by hand, that threshold would rot the day a seventh customer buys something. Computed inline, it cannot.', result:'Alex at $350 and Sam at $210 clear the bar. Nobody else is close. Two customers, $560 of a $910 store. "Alex spends a lot" grew up into "two of six beat the average, and one of them is 38% of revenue." That is not folklore anymore. That is a retention plan and a warning in the same sentence.', learning:'About the SQL: a subquery computes a value the outer query uses, benchmarks and thresholds being its natural habitat. About the business language: every comparison owes a denominator. "Above the average customer\'s $151.67" can be audited. "Big spender" can only be repeated.'},
'4.1':{situation:'House meeting, kitchen table, phones out. Three roommates, three versions of who paid for what, and one shared note that is half receipts and half vibes. Before anyone divides anything, the house needs one honest total: what did this place actually cost?', task:'Total the expenses. But two receipts never made it into the note, and they are sitting there as NULLs. Decide, as a house, what a missing receipt means before the math starts.', action:'COALESCE(amount, 0) turns each missing receipt into a zero on its way into SUM, so the total survives. Skip that step and something nastier happens: skip it in AVG later and the missing rows silently shrink your denominator instead.', result:'$4,193.75 for the house, rent doing most of the talking. The missing receipts are Jordan\'s cleaning supplies and Sam\'s household run. The house rule from today onward: no receipt, it counts as zero. Ungenerous, maybe. But a rule everyone can predict beats a debate every month.', learning:'About the SQL: COALESCE swaps a fallback in for NULL, and aggregates mostly ignore NULL rather than treating it as zero. Mostly is the trap. About the business language: missing data is a decision, not an accident. Say the rule out loud ("no receipt counts as zero") and the argument moves to whether the rule is fair, which is where it belongs.'},
'4.2':{situation:'The total is settled. Now the actual fight: who fronted what? Maya paid the rent, twice, and she would like the record to reflect that before anyone starts talking about who owes whom.', task:'Total expenses per roommate, missing receipts counting as zero, biggest first. One row per person, no payments yet. Patience. This lesson is only about who put money into the house.', action:'GROUP BY paid_by, with the same COALESCE rule from 4.1 inside the SUM. One new grain, one old rule. Consistency is doing more work here than any single clause.', result:'Maya fronted $3,660. Jordan $352.80. Sam $180.95. Rent is a hell of a drug. But fronting is not the same as bearing, because money has been moving back the other way too. That is tomorrow\'s lesson, and it changes the answer.', learning:'About the SQL: grouping by a person turns a ledger into a per-person story. About the business language: "fronted" and "borne" are different verbs, and half of all money arguments are two people using the same word for both.'},
'4.3':{situation:'Money has been flowing back. Jordan sent Maya $600 twice. Sam sent $600 twice and another $47.50 to Jordan, probably for something with a story. The ledger is two tables pretending not to know each other, and the house wants one picture.', task:'Count payments each way: how much each roommate sent, how much each received, side by side, per person. Then everyone can see the shape of the settling at once.', action:'Aggregate payments twice, once by sender and once by receiver, then join both summaries onto the roommate list. LEFT JOINs, so a person who never received anything still shows up with a zero instead of vanishing from the table.', result:'Maya received $2,400. Jordan received $47.50. Sam received a round zero, and that zero is the row everyone stares at. Two rents came back to Maya. Sam\'s return train has not left the station.', learning:'About the SQL: joining onto a complete list (the roommates) guarantees nobody is dropped for having no activity. About the business language: sent and received are two different reports, and putting them side by side is the whole trick. Half the settle-up confusion in the world is one column pretending to be both.'},
'4.4':{situation:'A small forensic moment. Two expense rows have no amount: Jordan\'s cleaning supplies, Sam\'s household run. Fine under the house rule, they count as zero. But zero is a counting choice, and Sam asks a fair question: "Is anything else missing that we just haven\'t noticed?"', task:'List the expenses with missing amounts. Names and categories. Then count how many there are, so "a couple" becomes a number the house can argue about precisely.', action:'WHERE amount IS NULL finds them. IS NULL, not equals NULL, because NULL is not a value you can equal. It is a missing answer, and missing answers get their own syntax.', result:'Exactly two: Jordan, cleaning. Sam, household. Nothing else is hiding. The rule from 4.1 now has a census, two known gaps out of ten rows, and the house knows precisely where its records are thin.', learning:'About the SQL: NULL means missing, IS NULL finds missing, and missing never equals anything, including NULL. About the business language: reporting completeness is a metric too. "Two of ten receipts missing" builds more trust than a total with silent holes in it.'},
'4.5':{situation:'Kitchen table, final round. Maya fronted two rents, so she feels ahead. Jordan paid a mountain of small bills and sent two $600 payments, so he feels ahead. Sam has receipts and grievances in equal measure. Three people cannot all be ahead. Net it out.', task:'For each roommate: everything they fronted, plus every payment they sent, minus every payment they received. One signed number per person. Fair share for reference: $4,193.75 split three ways is about $1,397.92 each.', action:'Three CTEs, three flows: paid, sent, received. The final select stitches them onto the roommate list with LEFT JOINs and wraps every seam in COALESCE, because one stray NULL in the arithmetic would erase a whole person from the answer.', result:'Jordan has borne the most: $1,505.30. Sam: $1,428.45. Maya, who fronted the rent, has borne the least: $1,260.00, because $2,400 flowed back to her. The table settles itself. Sam owes Jordan about $107, Maya owes about $138, and the argument ends with arithmetic where the adjectives used to be.', learning:'About the SQL: real questions compose. Small named steps, one combined at the end, COALESCE at every seam. About the business language: net is the grown-up form of every money argument. Gross claims start fights ("I paid the rent!"). Net positions, with the flows named, end them.'},
'5.1':{situation:'Twenty applications out the door. Your tracker says so, and your inbox says: silence, mostly. Somewhere inside the twenty are a few real conversations and a lot of closed doors. Tonight\'s question is the funnel one: where do my applications actually land?', task:'Count applications by stage, and turn each count into a percent of the twenty. Order by count so the shape of the search reads top to bottom: how many screened, interviewed, rejected, still waiting.', action:'GROUP BY stage, COUNT them, and divide by the total. That division placement matters: 100.0 times n divided by 20, computed after counting, or integer division will round your funnel into fiction.', result:'Six screened, five rejected, four still at applied, four interviewed, one offer. The middle is fat and the top is honest. This search is not failing. It is compounding, one screen at a time, and now you can see the conversion you have been feeling.', learning:'About the SQL: GROUP BY a status column turns a tracker into a funnel. About the business language: a funnel is stages with counts and percents, in order. "It feels slow" is a mood. "Thirty percent reach a screen" is a pipeline you can improve on purpose.'},
'5.2':{situation:'Your friend keeps saying "just apply to startups, they actually reply." It sounds right. It also sounds like the kind of thing people say. The tracker knows: every company has a type, and every application has an outcome. Test the folklore.', task:'Per company type: how many applications, how many reached interview, and the interview rate. Eight startups, six big tech, six agencies. Small numbers, so we hold our conclusions loosely. But percentages first.', action:'Count applications and interviews in the same grouped pass, with a conditional sum doing the interview counting (CASE inside SUM, or FILTER where your database supports it). Divide after, like always.', result:'Startups: 50%. Big tech: one of six, 16.7%. Agencies: zero of six. Your friend\'s folklore survives, and it brought receipts. Small samples, yes, stated out loud. But tonight\'s rule is simple: the next ten applications lean startup, and the tracker will grade that bet in a month.', learning:'About the SQL: a conditional sum counts rows that pass a test, inside a group. About the business language: a rate is interviews divided by applications, and the comparison only means anything with the same denominator logic on both sides. Name your sample size when you quote it.'},
'5.3':{situation:'A query comes back wrong in a specific, sneaky way. It returns a count that is too cheerful (every application looks interviewed) and a join that quietly repeats rows. This is the most realistic lesson in the series, because real SQL fails exactly like this: politely, and in production.', task:'Three bugs to find. Conditions on the joined events table are filtering applications out of existence. The interview flag is counting the wrong rows. And a GROUP BY is missing, so one application is masquerading as several. Read the broken query, name each bug, fix the structure, and use 5.1\'s funnel count (four interviews) as your lie detector.', action:'Move the events conditions into the JOIN\'s ON clause, so applications without qualifying events survive as NULLs instead of disappearing. Count only rows where the stage is actually interview. Group by application so each one gets exactly one row, however many events it collected.', result:'Four interviews, matching the funnel, no duplicates, no ghost successes. The query did not get more clever. It got more honest, which in debugging is usually the whole repair.', learning:'About the SQL: conditions in ON shape the join; conditions in WHERE filter after it, and confusing the two silently deletes rows. About the business language: a number that contradicts a report you trust is a bug report, not a disagreement. Reconcile first, argue later.'},
'5.4':{situation:'You have a theory about response times. The companies that moved fast felt interested, and the slow ones felt like paperwork. Marlow, the offer, took four days to screen. Is speed a signal about fit, or are you retrofitting a story onto a calendar?', task:'For each company that screened you, count the days from application to screen. Rank fastest first, and let the list argue with your theory.', action:'The events table holds both milestones, so join it to itself: the applied row and the screen row of the same application, side by side. Subtract the dates. In SQLite that is a julianday difference; elsewhere it is DATEDIFF and friends. Same idea, local accent.', result:'Marlow, four days, and Marlow is the offer. Verdant five, Kiteway six, Northwind and Corelink seven. It is five companies, not fifty, and the story stays modest. But fast movers behaving like interested parties is now a working hypothesis with numbers behind it, not a vibe.', learning:'About the SQL: joining a table to itself pairs milestones for the same entity, and date subtraction turns two timestamps into a duration. About the business language: "they got back to me fast" is an anecdote. "Median five days, and the offer came from the fastest" is the beginning of a metric.'},
'5.5':{situation:'Monday morning. Twenty applications out in the world, and they are not all equally alive. Some became screens and interviews; those have momentum. A few went out the door and into silence. Silence compounds. Every week an application sits unanswered, it looks less like a pending decision and more like a closed one.', task:'Build the follow-up list. Applications still sitting at applied, as of September 30th, with how many days each has been waiting. Longest first. The order of the output is the order of your morning.', action:'WHERE stage = applied isolates the waiting. Subtracting the applied date from September 30 gives each one an age, and CAST makes it a whole number a human can say out loud. ORDER BY that age, descending. Kraft is in the details here: the "today" is a choice, so we make it from the data\'s freshest date and say so.', result:'Umbra has waited twelve days. Loomly eleven. Ostro five. Tandem one. Two genuinely stale, one merely young. The Monday task writes itself, and it is not "apply to more." It is "revive the two oldest conversations before opening new ones."', learning:'About the SQL: a duration is a date subtracted from a stated as-of date, and stage plus age turns a tracker into a work queue. About the business language: "gone quiet" is a feeling until it has days attached. Twelve days is a triage decision. Feelings are not.'}
});
function storyCard(d, l){
  // Every lesson gets its story, told in paragraphs (STAR+L) — not a slide dump.
  let raw = STORIES[l.id];
  if(!raw && l.id==='1.1') raw = EP1_STORY;
  if(!raw) return '';
  const s = { s: raw.situation, t: raw.task, a: raw.action, r: raw.result, l: raw.learning };
  const isEp1 = (d.id==='coffee' && l.id==='1.1');
  return `<div class="card">
    <h3>📖 ${isEp1?'Episode 1, as a story':'The story behind this lesson'} (STAR+L)</h3>
    ${isEp1?'<p style="font-size:13.5px;color:var(--muted);margin-top:0">This is the slide deck rewritten as paragraphs — the same situation you’re about to solve below.</p>':''}
    <p><b style="color:var(--accent-ink)">Situation —</b> ${s.s}</p>
    <p><b style="color:var(--accent-ink)">Task —</b> ${s.t}</p>
    <p><b style="color:var(--accent-ink)">Action —</b> ${s.a}</p>
    <p><b style="color:var(--accent-ink)">Result —</b> ${s.r}</p>
    <p style="margin-bottom:0"><b style="color:var(--accent-ink)">Learning —</b> ${s.l}</p>
  </div>`;
}
function showLesson(d, l){
  curDb = d; curLesson = l; renderSidebar();
  const stage = document.getElementById('stage');
  const tbl = d.schema.split('\n').filter(x=>x.trim()).join('\n');
  const m = META[l.id] || {};
  stage.innerHTML = `
    <div class="card">
      <h3>${d.name} — Lesson ${l.id}: ${l.title} ${l.worked?'<small style="color:var(--accent-ink)">(worked example — build it from the steps; the full version waits in the last hint)</small>':''}</h3>
      <p style="margin:0 0 10px"><span class="diffchip">${lessonDifficulty(l).label}</span> <span class="xpchip">+${lessonDifficulty(l).xp} XP</span></p>
      <p style="font-size:13px;color:var(--muted);text-transform:uppercase;letter-spacing:1px;margin:0 0 4px">① Situation — someone needs a solution</p>
      <p><em>${d.story}</em></p>
      ${m.ask?`<p style="background:var(--accent-soft);border:1px solid var(--accent-border);border-radius:8px;padding:10px 14px"><b>${m.asker} asks:</b> ${m.ask}</p>`:''}
      <p style="font-size:13px;color:var(--muted);text-transform:uppercase;letter-spacing:1px;margin:14px 0 4px">② Task — what actually has to be done</p>
      ${(m.task||[l.problem]).map(t=>`<p style="margin:4px 0">• ${t}</p>`).join('')}
      <div class="editor schema-editor"><div class="ebar"><i></i><i></i><i></i><span>schema — ${d.id} · CREATE TABLE</span></div><pre>${hlSql(tbl)}</pre></div>
    </div>
    ${storyCard(d,l)}
    <div class="card dbview">
      <h3>📊 The database you’re working with</h3>
      <p style="font-size:13.5px;color:var(--muted);margin-top:0">This is the live data your query runs against. Edit it by accident? Hit Reset — this view refreshes so you can always see the starting truth.</p>
      <div id="dbview"></div>
    </div>
    <div class="card">
      <p style="font-size:13px;color:var(--muted);text-transform:uppercase;letter-spacing:1px;margin:0 0 4px">③ Action — write the SQL that gets that result</p>
      <h3>Example problem</h3><p>${l.problem}</p>
      <details style="margin:0 0 10px">
        <summary style="cursor:pointer;font-weight:bold;color:var(--accent-ink);font-size:14px">Hints — how to think through the task (open when stuck)</summary>
        <div style="background:var(--accent-soft);border:1px dashed var(--accent-border);border-radius:8px;padding:10px 14px;margin-top:8px;font-size:14px">
          ${(m.task||[l.problem]).map((t,i)=>`<p style="margin:4px 0"><b>Step ${i+1}:</b> ${t}</p>`).join('')}
          <p style="margin:6px 0 0"><b>Read it aloud first:</b> if you cannot say what one row of the output means, the grain is wrong.</p>
          <details id="fullhint" style="margin-top:10px">
            <summary style="cursor:pointer;font-weight:bold;color:#b03a2e;font-size:13.5px">Last hint — the full query (build yours first; this is the answer)</summary>
            <pre style="background:#111827;color:#e5e7eb;border-radius:8px;padding:10px 12px;font-size:12.5px;overflow-x:auto;white-space:pre-wrap;margin:8px 0 0">${l.starter.replace(/</g,'&lt;')}</pre>
          </details>
        </div>
      </details>
      <p style="font-size:13px;color:var(--muted);margin:0 0 6px">Start by looking at the data — the editor begins with <code>SELECT *</code> on this database’s first table. Run it, read the table, then build the real query.</p>
      <div class="editor"><div class="ebar"><i></i><i></i><i></i><span id="edlabel">editor</span></div><div class="edwrap"><pre id="hlcode" aria-hidden="true"></pre><textarea id="sqlbox" spellcheck="false"></textarea></div></div>
      <div class="btnrow">
        <button class="act" id="run">▶ Run query</button>
        <button class="ghost" id="reset">↺ Reset database</button>
        <button class="ghost" id="clear">Clear editor</button>
        <button class="ghost" id="mark">${done[d.id+':'+l.id]?'✓ Completed':'Mark complete'}</button>
      </div>
      <div id="status"></div>
      <div id="out"></div>
    </div>
    <div class="card" style="border-color:var(--accent-ink)">
      <p style="font-size:13px;color:var(--muted);text-transform:uppercase;letter-spacing:1px;margin:0 0 4px">④ Result — what the right answer shows</p>
      ${m.result?`<p>${m.result}</p>`:'<p>Run the query above and compare the output to the problem: does it actually answer the ask?</p>'}
      <p style="font-size:13px;color:var(--muted);text-transform:uppercase;letter-spacing:1px;margin:14px 0 4px">⑤ Learning — what we learned</p>
      <p style="margin:4px 0"><b>About the SQL:</b> ${m.learnSql||''}</p>
      <div class="sayit">Say it like you work there: ${l.sayit}</div>
      ${m.tip?`<div class="tipbox">💡 <b>Background tip — both are allowed:</b> ${m.tip}</div>`:''}
    </div>
    <div class="card">
      <h3 style="margin-top:0">📖 Terms used in this lesson</h3>
      ${l.vocab.map(v=>`<div class="vocab"><b>${v[0]}:</b> ${v[1]}</div>`).join('')}
    </div>
    <div class="donatebox">If this lesson helped, <a href="${DONATE_URL}" target="_blank" rel="noopener">☕ buy me a coffee</a> — it keeps Speak SQL free for the next learner.</div>`;
  const firstTable = (d.schema.match(/CREATE TABLE\s+(\w+)/i)||[])[1] || 'orders';
  const sb0 = document.getElementById('sqlbox');
  sb0.value = 'SELECT * FROM ' + firstTable + ';';
  document.getElementById('edlabel').textContent = 'editor — ' + d.id + ' · ' + firstTable;
  sb0.oninput = syncHl; sb0.onscroll = syncHl; syncHl();
  lessonStartedAt = Date.now(); firstQueryInLesson = true; fullHintOpened = false; hadSqlErrorThisLesson = false;
  const fh = document.getElementById('fullhint'); if(fh) fh.addEventListener('toggle', ()=>{ if(fh.open) fullHintOpened = true; });
  renderRail();
  renderDbViewer();
  document.getElementById('run').onclick = runQuery;
  document.getElementById('reset').onclick = ()=>{ db=new SQL.Database(); db.run(d.schema); db.run(d.seed); renderDbViewer(); setStatus('Database reset to its starting data. Nothing else changed.',''); document.getElementById('out').innerHTML=''; };
  document.getElementById('clear').onclick = ()=>{ document.getElementById('sqlbox').value=''; syncHl(); };
  document.getElementById('mark').onclick = (e)=>{ const k=d.id+':'+l.id; done[k]=!done[k]; if(!done[k]) delete done[k]; else noteDay(); saveDone(); e.target.textContent = done[k]?'✓ Completed':'Mark complete'; };
}
function setStatus(msg, cls){ const s=document.getElementById('status'); s.innerHTML=msg; s.className=cls; }
function runQuery(){
  const q = document.getElementById('sqlbox').value.trim();
  const out = document.getElementById('out');
  if(!q){ setStatus('Write a query first. Even a wrong one teaches more than a blank box.','err'); return; }
  if(/\bDROP\s+TABLE\b/i.test(q)){
    awardAchievement('oops');
    setStatus('💥 OOPS! Achievement unlocked. Nice try. The table is protected, and your buddy has confiscated the keyboard.','err');
    out.innerHTML=''; return;
  }
  const lessonKey = curDb.id+':'+curLesson.id;
  const wasAlreadyDone = !!done[lessonKey];
  try{
    const res = db.exec(q);
    renderDbViewer();
    if(firstQueryInLesson && /^\s*select\s+\*\s+from\b/i.test(q)) awardAchievement('look');
    firstQueryInLesson = false;
    if(!res.length){
      if(/^\s*(select|with)\b/i.test(q)) awardAchievement('notfound');
      setStatus('Query ran. No result set (or the table is empty).',''); out.innerHTML=''; return;
    }
    const {columns, values} = res[0];
    out.innerHTML = `<table class="res"><tr>${columns.map(c=>`<th>${c}</th>`).join('')}</tr>${values.map(r=>`<tr>${r.map(v=>`<td>${v===null?'<em>NULL</em>':v}</td>`).join('')}</tr>`).join('')}</table>`;
    if(values.length===0) awardAchievement('notfound');
    if(values.some(r=>r.some(v=>v===null))) awardAchievement('nullvoid');
    if(values.length===1) awardAchievement('tableone');
    if(/^\s*with\b/i.test(q)) awardAchievement('cteness');
    if(!q.endsWith(';')) awardAchievement('cowboy');
    if(q===q.toUpperCase() && /SELECT/.test(q)) awardAchievement('caps');
    if(/--/.test(q)) awardAchievement('commentator');
    if(/\bSUM\s*\(/i.test(q) && /\bCOUNT\s*\(/i.test(q) && /\bAVG\s*\(/i.test(q)) awardAchievement('aggregates');
    if(((q.match(/\bJOIN\b/gi)||[]).length)>=2) awardAchievement('jamboree');
    const hour = new Date().getHours(); if(hour>=0 && hour<5) awardAchievement('night');
    const ok = checkResult(res, curLesson);
    if(ok===true){
      if(wasAlreadyDone){
        awardAchievement('secondlap');
        setStatus('✓ Correct again. Practice lap complete. No duplicate XP, just stronger SQL muscles.','ok');
      } else {
        if(Date.now()-lessonStartedAt <= 60000) awardAchievement('speed');
        if(!fullHintOpened) awardAchievement('hintless');
        if(hadSqlErrorThisLesson) awardAchievement('meant');
        done[lessonKey]=true; noteDay(); saveDone();
        setStatus('✓ Correct. That matches the expected result, +'+lessonDifficulty(curLesson).xp+' XP earned. Say the sentence out loud before you move on.','ok');
      }
    }
    else if(ok===false){ setStatus('Ran fine, but the result doesn’t match the problem yet. Check your grain, then your filter. Reset and retry if the data got edited.','err'); }
    else setStatus('Ran. Compare it against the problem statement. Does it actually answer it?','ok');
  }catch(e){ hadSqlErrorThisLesson = true; setStatus('SQL error: '+e.message+'. Read it literally; it usually names the exact line that broke.','err'); out.innerHTML=''; }
}
initSqlJs({ locateFile: f => 'https://cdnjs.cloudflare.com/ajax/libs/sql.js/1.8.0/'+f }).then(sql=>{
  SQL = sql; renderProgress(); renderSidebar(); loadDb(DATABASES[0]);
}).catch(e=>{ document.getElementById('stage').innerHTML = '<div class="card"><h3>Could not load the SQL engine</h3><p>'+e.message+'</p></div>'; });
</script>
