<style>
  /* Design: mockup 02 (2026-10-08) — warm paper, ink, orange accent, hard-shadow donate */
  :root{--ink:#1c1917;--paper:#f6f3ec;--card:#fff;--line:#e7e0d2;--accent:#ea580c;--accent-strong:#c2410c;--accent-ink:#9a3412;--accent-soft:#fff7ed;--accent-pale:#ffcfad;--accent-border:#fed7aa;--syntax-kw:#f472b6;--syntax-fn:#2563eb;--syntax-str:#16a34a;--muted:#78716c;--green:#16a34a}

  .editor{background:#111827;border-radius:20px;overflow:hidden;box-shadow:0 12px 32px rgba(2,6,23,.25);border:1px solid #020617}

  .xpchip{display:inline-flex;align-items:center;border-radius:999px;background:var(--accent);color:#fff;padding:2px 8px;font-size:11px;font-weight:900;letter-spacing:.02em;white-space:nowrap}

  .ebar{display:flex;gap:7px;align-items:center;padding:11px 14px;background:#020617}

  .kw{color:var(--syntax-kw)}.fn{color:var(--syntax-fn)}.str{color:var(--syntax-str)}.com{color:#64748b;font-style:italic}

  .buddyface{font-size:44px;line-height:1;text-align:center}
  .achvsummary{display:flex;justify-content:space-between;align-items:center;gap:10px}
  .achvcount{font-size:28px;font-weight:900;letter-spacing:-.03em;color:var(--accent)}
  .achvrow{display:flex;gap:10px;align-items:flex-start;padding:9px 0;border-top:1px dashed var(--line);font-size:13px}
  .achvrow .icon{font-size:20px;line-height:1.1;min-width:24px;text-align:center}
  .achvrow.locked{opacity:.48}
  .achvrow.hiddenrow{opacity:.72}

  .achvrow span{color:var(--muted);line-height:1.4}
  .achvtoast{position:fixed;right:22px;bottom:22px;z-index:99;background:var(--ink);color:#fff;border:1px solid var(--accent-border);border-radius:18px;box-shadow:0 18px 44px rgba(0,0,0,.28);padding:14px 16px;max-width:330px;animation:achvin .35s cubic-bezier(.2,1.4,.4,1) both}
  .achvtoast b{color:var(--accent-pale)}

  aside{border:1px solid var(--line);border-radius:22px;padding:18px;background:var(--card);box-shadow:0 12px 32px rgba(28,25,23,.06);overflow-y:auto;max-height:calc(100vh - 110px)}

  .lessonbtn{display:flex;justify-content:space-between;align-items:center;gap:8px;width:100%;text-align:left;background:transparent;border:1px solid transparent;padding:10px 12px;margin-top:4px;cursor:pointer;font-family:inherit;font-size:13.5px;border-radius:12px;color:var(--ink)}

  .card h3{margin:0 0 8px;font-size:19px;letter-spacing:-.02em}
  .vocab{background:#fafaf9;border:1px solid var(--line);border-radius:12px;padding:10px 14px;margin:8px 0;font-size:14.5px}

  .tables{font-size:13px;color:var(--muted)}
  .tables code{background:var(--accent-soft);padding:1px 5px;border-radius:4px}
  pre.schema{background:#111827;color:#e5e7eb;border-radius:16px;padding:14px 16px;font-size:12.5px;overflow-x:auto;white-space:pre-wrap}
  textarea{width:100%;min-height:130px;font-family:ui-monospace,'SF Mono',Menlo,Consolas,monospace;font-size:14.5px;line-height:1.6;padding:16px;border:1px solid #020617;border-radius:16px;background:#111827;color:#e5e7eb;caret-color:var(--syntax-kw);box-shadow:0 12px 32px rgba(2,6,23,.25)}
  textarea:focus{outline:2px solid var(--accent);outline-offset:2px}
  .btnrow{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}
  button.act{background:var(--accent-strong);color:#fff;border:1px solid var(--ink);padding:10px 20px;border-radius:999px;cursor:pointer;font-family:inherit;font-size:14px;font-weight:800;box-shadow:3px 3px 0 rgba(28,25,23,.25)}
  button.act:hover{background:var(--accent)}
  button.ghost{background:#fff;color:var(--ink);border:1px solid var(--line);padding:10px 16px;border-radius:999px;cursor:pointer;font-family:inherit;font-size:14px;font-weight:600}
  button.act:disabled{opacity:.5}
  #status{font-size:14px;min-height:20px;margin:6px 0}
  .ok{color:var(--green);font-weight:bold}.err{color:#b91c1c}
  table.res{border-collapse:collapse;font-size:13.5px;margin-top:8px;font-variant-numeric:tabular-nums}
  table.res th,table.res td{border:1px solid #f0ebe0;padding:7px 11px;text-align:left}
  table.res th{background:var(--accent-soft);color:var(--muted);font-weight:700}
  .dbview table.res{margin:6px 0 14px}
  .dbview .tblwrap{max-height:280px;overflow:auto;border:1px solid var(--line);border-radius:16px;margin:4px 0 14px}
  .dbview .tblwrap table{margin:0;border:none;width:100%}
  .dbview .tblwrap th{position:sticky;top:0}
  .dbview h4{margin:10px 0 2px;font-size:14.5px;color:var(--accent-ink)}
  .dbview .rowcount{font-size:12px;color:var(--muted)}
  details.slides summary{cursor:pointer;font-weight:800;font-size:15px;color:var(--accent-ink)}
  details.slides .slide{border-top:1px dashed var(--line);padding:10px 2px}
  details.slides .slide h4{margin:2px 0 4px;font-size:14.5px}
  details.slides .slide p{margin:3px 0;font-size:14px}
  details.slides pre{background:#111827;color:#e5e7eb;border-radius:12px;padding:10px 12px;font-size:12.5px;overflow-x:auto}
  details.slides .num{color:var(--accent);font-weight:bold}
  .hintbox{display:none;background:var(--accent-soft);border:1px dashed var(--accent-border);border-radius:16px;padding:12px 16px;font-size:13.5px;margin-top:8px;white-space:pre-wrap;font-family:ui-monospace,Menlo,Consolas,monospace}
  .tipbox{background:var(--accent-soft);border:1px dashed var(--accent-border);border-radius:16px;padding:12px 16px;font-size:13.5px;margin-top:12px;color:#31445a}
  .donatebox{margin-top:16px;text-align:center;font-size:13.5px;color:var(--muted)}
  .donatebox a{display:inline-block;background:#ffdd00;color:var(--ink);font-weight:800;text-decoration:none;padding:10px 18px;border-radius:999px;border:1px solid var(--ink);box-shadow:3px 3px 0 var(--ink)}
  .donatebox a:hover{background:#ffe94d;transform:translate(-1px,-1px);box-shadow:4px 4px 0 var(--ink)}
  aside .donatebox{padding:14px 6px 4px;border-top:1px solid #f5f5f4;margin-top:16px}
  @media(max-width:800px){main{grid-template-columns:1fr}aside,section{max-height:none}}

<main>
  <aside id="sidebar"></aside>

<script src="https://cdnjs.cloudflare.com/ajax/libs/sql.js/1.8.0/sql-wasm.js"></script>
<script>
const DATABASES = [
{ id:'coffee', name:'☕ The Coffee Shop', tag:'GROUP BY · HAVING · DISTINCT',
  story:'Which drink actually makes this shop money — and which one just looks popular?',
  schema:`CREATE TABLE orders (
  order_id INTEGER PRIMARY KEY, customer_name TEXT,
  drink TEXT, size TEXT, price REAL, ordered_at TEXT
);`,
  seed:`INSERT INTO orders (customer_name, drink, size, price, ordered_at) VALUES
('Maya','latte','M',5.50,'2026-10-01'),('Jordan','cold brew','L',5.00,'2026-10-01'),
('Maya','latte','M',5.50,'2026-10-02'),('Sam','matcha','M',6.00,'2026-10-02'),
('Priya','espresso','S',3.50,'2026-10-02'),('Jordan','cold brew','L',5.00,'2026-10-03'),
('Alex','latte','L',6.50,'2026-10-03'),('Sam','matcha','M',6.00,'2026-10-03'),
('Priya','latte','M',5.50,'2026-10-04'),('Alex','espresso','S',3.50,'2026-10-04'),
('Maya','cold brew','M',4.50,'2026-10-05'),('Sam','latte','M',5.50,'2026-10-05'),
('Priya','matcha','L',7.00,'2026-10-05'),('Jordan','espresso','S',3.50,'2026-10-06'),
('Alex','cold brew','L',5.00,'2026-10-06');`,
  lessons:[
   {id:'0.1', title:'SELECT — just look at the data',
    vocab:[['SELECT','the verb that reads data. SELECT * means “every column.” Naming columns means “just these.”'],['Table / row / column','a table is the grid; a row is one record; a column is one fact per record.']],
    problem:'Show only drink, size, and price for every order. No filtering, no math — just look.',
    starter:`SELECT drink, size, price
FROM orders;`,
    sayit:'“Before I analyze anything, I look at the raw rows — grain first, questions second.”',
    expect:null},
   {id:'0.2', title:'WHERE — keep only the rows you mean',
    vocab:[['WHERE','filters rows before anything else happens. The condition is a yes/no test per row.'],['String literal','text values go in single quotes: drink = ’latte’. Numbers don’t.']],
    problem:'List customer, drink, and price for latte orders only.',
    starter:`SELECT customer_name, drink, price
FROM orders
WHERE drink = 'latte';`,
    sayit:'“I filtered at the row level — WHERE decides which orders even enter the room.”',
    expect:[['Alex','latte',6.5],['Maya','latte',5.5],['Maya','latte',5.5],['Priya','latte',5.5],['Sam','latte',5.5]]},
   {id:'0.3', title:'ORDER BY + LIMIT — biggest first, top few',
    vocab:[['ORDER BY','sorts the result. DESC = biggest/highest first; ASC = smallest first.'],['LIMIT','caps how many rows come back. ORDER BY + LIMIT = every “top N” answer ever.']],
    problem:'The three most expensive orders in the shop: customer, drink, price, priciest first.',
    starter:`SELECT customer_name, drink, price
FROM orders
ORDER BY price DESC
LIMIT 3;`,
    sayit:'“Top three by price — I sorted before I limited, or the ‘top’ would be random rows.”',
    expect:null},
   {id:'1.1', title:'GROUP BY — revenue per drink', worked:true,
    vocab:[['Grain','the level of detail one row represents. Here: one row = one order. Say it before you query.'],['Dimension vs measure','dimension = what you slice by (drink); measure = what you add up (price).'],['Aggregate function','SUM / COUNT / AVG — many values in, one number out, per group.']],
    problem:'Revenue and order count per drink, biggest revenue first.',
    starter:`SELECT drink, COUNT(*) AS orders, ROUND(SUM(price),2) AS revenue
FROM orders
GROUP BY drink
ORDER BY revenue DESC;`,
    sayit:'“I’d cut revenue by drink at the order grain before I touch the menu — blended sales hide which item is carrying the shop.”',
    expect:[['latte',5,28.5],['cold brew',4,19.5],['matcha',3,19],['espresso',3,10.5]]},
   {id:'1.2', title:'HAVING — only the proven sellers',
    vocab:[['HAVING','filters groups AFTER aggregation. WHERE filters rows before. Using WHERE on an aggregate is the classic trap.']],
    problem:'Same revenue-per-drink table, but only drinks with 4 or more orders.',
    starter:`SELECT drink, COUNT(*) AS n, ROUND(SUM(price),2) AS revenue
FROM orders
GROUP BY drink
-- your HAVING line here
ORDER BY revenue DESC;`,
    sayit:'“WHERE can’t see a group total — that’s HAVING’s job, and interviewers listen for exactly this.”',
    expect:[['latte',5,28.5],['cold brew',4,19.5]]},
   {id:'1.3', title:'DISTINCT — count people, not rows',
    vocab:[['COUNT(DISTINCT …)','counts real entities. COUNT(*) counts rows, duplicates included.']],
    problem:'How many distinct customers ordered each drink? (Latte = 4: Maya, Alex, Priya, Sam — Maya came twice.)',
    starter:`SELECT drink, COUNT(DISTINCT customer_name) AS customers
FROM orders
GROUP BY drink
ORDER BY customers DESC;`,
    sayit:'“COUNT(*) told me five lattes; COUNT(DISTINCT) told me four people. Different question, different answer.”',
    expect:[['latte',4],['cold brew',3],['matcha',2],['espresso',3]]},
   {id:'1.4', title:'Two-column GROUP BY — drink × size',
    vocab:[['Two-column GROUP BY','group by two dimensions at once: one row per combination.']],
    problem:'Order count and revenue for every drink-and-size combination.',
    starter:`SELECT drink, size, COUNT(*) AS n, ROUND(SUM(price),2) AS revenue
FROM orders
GROUP BY drink, size
ORDER BY drink, revenue DESC;`,
    sayit:'“Same data, finer grain — the size split is where the pricing story lives.”',
    expect:[['cold brew','L',3,15],['cold brew','M',1,4.5],['espresso','S',3,10.5],['latte','L',1,6.5],['latte','M',4,22],['matcha','L',1,7],['matcha','M',2,12]]},
   {id:'1.5', title:'Daily trend — revenue by day',
    vocab:[['Time bucket','grouping by a date column turns a table into a trend. One row per day = the day grain.'],['Trend vs total','a total tells you how much; a trend tells you which direction and how steadily.']],
    problem:'Orders and revenue per day, in date order. Is the shop growing, or was one day just loud?',
    starter:`SELECT ordered_at, COUNT(*) AS orders, ROUND(SUM(price),2) AS revenue
FROM orders
GROUP BY ordered_at
ORDER BY ordered_at;`,
    sayit:'“At the day grain, revenue oscillates between $8.50 and $17.50 — six days is weather, not a trend, and I’d say so.”',
    expect:[['2026-10-01',2,10.5],['2026-10-02',3,15],['2026-10-03',3,17.5],['2026-10-04',2,9],['2026-10-05',3,17],['2026-10-06',2,8.5]]}
  ]},
{ id:'creator', name:'🎬 Creator Studio', tag:'Window functions · CTR · LAG',
  story:'My views went up but my channel is doing worse — here’s the query that shows it.',
  schema:`CREATE TABLE posts (
  post_id INTEGER PRIMARY KEY, platform TEXT, title TEXT,
  posted_at TEXT, views INTEGER, clicks INTEGER, watch_seconds INTEGER
);`,
  seed:`INSERT INTO posts (platform, title, posted_at, views, clicks, watch_seconds) VALUES
('YouTube','SQL in 60 seconds','2026-09-07',1200,96,41000),
('YouTube','GROUP BY without tears','2026-09-14',1850,130,72000),
('YouTube','The NULL trap','2026-09-21',2400,144,81000),
('YouTube','Window functions, simply','2026-09-28',3100,155,99000),
('TikTok','SQL in 60 seconds','2026-09-07',8400,210,61000),
('TikTok','GROUP BY without tears','2026-09-14',11200,224,74000),
('TikTok','The NULL trap','2026-09-21',15800,237,92000),
('TikTok','Window functions, simply','2026-09-28',19900,259,118000),
('Instagram','SQL in 60 seconds','2026-09-07',3100,155,28000),
('Instagram','GROUP BY without tears','2026-09-14',3600,162,31000),
('Instagram','The NULL trap','2026-09-21',4200,168,34000),
('Instagram','Window functions, simply','2026-09-28',4700,179,39000);`,
  lessons:[
   {id:'2.1', title:'Window functions — CTR + running total', worked:true,
    vocab:[['CTR — click-through rate','clicks ÷ views. Measures pull. Falling CTR + flat views = title/thumbnail fatigue.'],['Window function','adds a computed column WITHOUT collapsing rows. GROUP BY shrinks; windows annotate.']],
    problem:'Per post: CTR %, plus cumulative (running) views per platform over time.',
    starter:`SELECT platform, title, views,
       ROUND(100.0*clicks/views,1) AS ctr_pct,
       SUM(views) OVER (PARTITION BY platform ORDER BY posted_at) AS running_views
FROM posts
ORDER BY platform, posted_at;`,
    sayit:'“CTR is softening while views climb, so my first hypothesis is creative fatigue, not the algorithm punishing me.”',
    expect:null},
   {id:'2.2', title:'LAG — week-over-week change',
    vocab:[['LAG','pulls the previous row’s value into this row. Period-over-period without a self-join.']],
    problem:'Per platform, how many views did each post gain over the previous post?',
    starter:`SELECT platform, posted_at, views,
       views - LAG(views) OVER (PARTITION BY platform ORDER BY posted_at) AS wow_change
FROM posts
ORDER BY platform, posted_at;`,
    sayit:'“LAG turns ‘are we growing?’ into a column instead of a vibe.”',
    expect:null},
   {id:'2.3', title:'RANK — best post per platform',
    vocab:[['RANK vs ROW_NUMBER','RANK leaves gaps after ties (1,2,2,4); ROW_NUMBER never ties. Know which the question wants.']],
    problem:'Rank posts by views within each platform, best = 1.',
    starter:`SELECT platform, title, views,
       RANK() OVER (PARTITION BY platform ORDER BY views DESC) AS rnk
FROM posts
ORDER BY platform, rnk;`,
    sayit:'“Window functions let me rank within each platform without collapsing the detail.”',
    expect:null},
   {id:'2.4', title:'The real question — CTR by platform',
    vocab:[['Segmentation','a blended number is usually one segment doing something explainable. Always cut it.']],
    problem:'Average CTR per platform. Which audience actually clicks? (YouTube 6.1%, Instagram 4.3%, TikTok 1.7%.)',
    starter:`SELECT platform, ROUND(100.0*SUM(clicks)/SUM(views),1) AS ctr_pct
FROM posts
GROUP BY platform
ORDER BY ctr_pct DESC;`,
    sayit:'“The biggest platform converts worst. Reach isn’t pull — say the segment, not the blend.”',
    expect:[['YouTube',6.1],['Instagram',4.3],['TikTok',1.7]]},
   {id:'2.5', title:'Share of platform — each post’s slice',
    vocab:[['Percent of total','a row’s value divided by its group’s total. Needs the total computed alongside every row — window territory.'],['SUM() OVER (PARTITION BY …)','a group total attached to each row without collapsing the group.']],
    problem:'For YouTube only: each post’s views, and its % share of YouTube’s total views.',
    starter:`SELECT platform, title, views,
       ROUND(100.0*views/SUM(views) OVER (PARTITION BY platform),1) AS pct_of_platform
FROM posts
WHERE platform = 'YouTube'

sp AS (SELECT channel AS ch, SUM(spend) AS spend FROM ad_spend GROUP BY channel)

   {id:'4.5', title:'Net position — what each roommate has actually borne',
    vocab:[['Net position','everything a person put in minus everything they got back. The settle-up number.'],['Composing CTEs','several named steps (paid, sent, received) combined in one final calculation — complex logic, readable order.']],

    starter:`WITH paid AS (

// Episode 1 told as one story — STAR+L: Situation, Task, Action, Result, Learning.
// (This is the slide deck's content, rewritten as readable paragraphs.)
const EP1_STORY = {
  situation:'A small coffee shop has been open six weeks. The owner, Maya, keeps hearing the same sentence from her staff: “Espresso is our most popular drink — it’s always on the ticket.” Popular sounds like profitable, so the espresso has been getting the best menu spot, the chalkboard, and the morning push. Nobody has ever checked whether popular and profitable are the same thing here, because the only record of the business is a single table of fifteen orders: who ordered, what drink, what size, what price, when.',
  task:'Maya’s actual question is a decision, not a query: “Which drink should I build next month’s menu around?” Translating that into work means one determined task — rank the drinks by the money each one actually brought in. That requires grouping fifteen individual orders into one row per drink, counting how many orders sit in each group, and summing the price inside each group. Popularity (a count) and money (a sum) have to be computed separately, or the decision gets made on the wrong number.',
  action:'The tool is GROUP BY. One row in the orders table is one order — that level of detail is the grain, and naming it first is what keeps everything after it honest. Group by the dimension (drink, the label), aggregate the measure (price, the money): COUNT(*) for orders, SUM(price) for revenue, sorted biggest first. Three words carry the whole lesson: grain (what one row is), dimension vs measure (label vs number), and aggregate function (many rows in, one number out).',
  result:'The query returns four rows, and the staff’s story collapses. Latte leads with 5 orders and $28.50 — the shop’s real earner. Espresso does sell like matcha, 3 orders each, but it earns barely half the money: $10.50 against $19.00. Count alone would have called espresso and matcha equals; revenue tells the truth. The drink that was getting the chalkboard was the weakest earner on the menu.',
  learning:'What the SQL taught: GROUP BY collapses rows into one row per category so an aggregate can be computed inside each category, and every non-aggregated column you select has to be part of that grouping. What the business language taught: a finding is only sayable when it names its grain and its dimension — “I’d cut revenue by drink at the order grain before I touch the menu” is a sentence a decision-maker can act on, because it says what was counted, what was summed, and what happens next.'
};

// Per-lesson STAR+L framing. situation: the scene; ask: someone asking for a solution;
// task: what actually has to be done because of the ask; result: what the correct
// answer shows; learnSql: what we learned about SQL itself. The business-language
// half of the learning lives in each lesson's vocab + "say it" line (recap, below).
const META = {
'1.1':{asker:'Maya, the owner', ask:'“Which drink should I build next month’s menu around? Everyone says espresso is the popular one.”', task:['State the grain first: one row = one order.','Group the 15 orders into one row per drink (the dimension).','Inside each group: COUNT(*) the orders, SUM the price (the measure).','Sort by revenue, biggest first — the ranking is the decision.'], result:'Latte carries the shop: 5 orders, $28.50. Espresso ties matcha on orders (3 each) and earns barely half ($10.50 vs $19.00).', learnSql:'GROUP BY collapses many rows into one row per category; aggregate functions (SUM, COUNT, AVG) then compute one number inside each group.', tip:'SUM(price) and ROUND(SUM(price), 2) both pass here — in this data they return identical values. The difference is background knowledge worth carrying: computers store most decimals approximately, so sums over prices like $5.99 can surface as 28.499999999999996. ROUND(…, 2) snaps the display to cents without changing anything stored. Here every price ends in .50 or .00 (exactly representable), so the rounding is invisible — on real money data, it’s the habit that saves you.'},
'1.2':{asker:'Maya, the owner', ask:'“That full list is nice, but I only promote drinks that already sell. Show me just the proven ones — four orders or more.”', task:['Start from the 1.1 grouped result — the filter applies to groups, not rows.','The condition (orders ≥ 4) is about an aggregate, so it cannot go in WHERE.','Filter the finished groups with HAVING COUNT(*) >= 4.'], result:'Two drinks survive: latte (5 orders) and cold brew (4). Matcha and espresso drop off the promotion list.', learnSql:'WHERE filters rows before grouping; HAVING filters groups after aggregation. A condition on an aggregate can only live in HAVING.'},
'1.3':{asker:'Jordan, the shift lead', ask:'“Five lattes on the report — but is that five customers, or Maya’s regulars ordering twice? I need real people, not receipts.”', task:['“Real people” means unique customer names per drink.','COUNT(*) counts rows (receipts), so it overstates people.','COUNT(DISTINCT customer_name) counts each person once per drink.'], result:'Latte is 4 people, not 5 — Maya ordered twice. Cold brew and espresso reach 3 people each; matcha only 2.', learnSql:'COUNT(DISTINCT column) counts unique entities. Choosing between COUNT(*) and COUNT(DISTINCT) is choosing what question you are answering.'},
'1.4':{asker:'Maya, the owner', ask:'“Before I reprice anything, break each drink down by size. Maybe the large is doing all the work.”', task:['The slice is now two dimensions at once: drink AND size.','Group by both columns — one row per combination.','Count and sum inside each combination, then read drink by drink.'], result:'Latte’s money is a medium story ($22.00 of its $28.50); cold brew is a large story ($15.00 of $19.50). Same drink, different business.', learnSql:'GROUP BY accepts multiple columns: the output grain becomes one row per combination of the grouped dimensions.'},
'2.1':{asker:'You, the creator', ask:'“Views are up every week, so the channel is healthy… right? Something feels off.”', task:['Views alone hide pull — compute CTR (clicks ÷ views) for every post.','Keep every post as its own row; add a running total of views per platform over time.','That “add a column without collapsing rows” job is a window function, not GROUP BY.'], result:'TikTok’s CTR slides 2.5% → 1.3% while its views climb. The biggest platform has the weakest pull — the feeling was data.', learnSql:'A window function computes across related rows (PARTITION BY platform, ORDER BY date) and attaches the result to each row instead of collapsing rows into groups.'},
'2.2':{asker:'You, the creator', ask:'“Don’t just show me totals — how much did each new post actually add over the last one?”', task:['The comparison is row-to-previous-row, inside each platform, in date order.','LAG(views) pulls the previous post’s views into the current row.','Subtract: current minus previous = the week-over-week change.'], result:'Every platform is growing, but the increments tell the story — TikTok adds thousands per post; YouTube adds hundreds. Growth has a shape, not just a direction.', learnSql:'LAG (and its twin LEAD) reaches into the previous or next row inside a window — period-over-period math without joining a table to itself.'},
'2.3':{asker:'A sponsor', ask:'“Before I pay for placement: what’s your #1 post on each platform? Not overall — per platform.”', task:['“Per platform” means rank inside groups, not across the whole table.','RANK() OVER (PARTITION BY platform ORDER BY views DESC) restarts the ranking per platform.','Every platform gets its own #1.'], result:'“Window functions, simply” is the #1 post on all three platforms — one title, three leaderboards. That’s the sponsor’s answer.', learnSql:'PARTITION BY inside OVER() restarts a window calculation per group; RANK leaves gaps after ties (1, 2, 2, 4), ROW_NUMBER never ties.'},
'2.4':{asker:'You, allocating next month’s effort', ask:'“I can only push one platform. Forget total views — whose audience actually clicks?”', task:['The decision metric is CTR per platform, aggregated over all posts.','SUM(clicks) ÷ SUM(views) per platform — ratio of sums, not average of ratios.','Rank platforms by that CTR.'], result:'YouTube 6.1%, Instagram 4.3%, TikTok 1.7%. The platform with the most views converts worst. Effort goes to YouTube.', learnSql:'Aggregating a ratio means summing the numerator and denominator separately, then dividing — averaging pre-computed percentages quietly weights every post equally.'},
'3.1':{asker:'You, store owner', ask:'“Break down revenue by where customers came from. And don’t lose anyone — I want to see the channels that brought people who never bought, too.”', task:['Customers and orders live in different tables — join them on customer_id.','“Don’t lose anyone” rules out INNER JOIN; LEFT JOIN keeps zero-order customers.','One customer has many orders, so count people with COUNT(DISTINCT …) or the join inflates them (fan-out).'], result:'Instagram: 3 customers, $315. Organic: 2 customers, $350 — the best revenue with zero ad spend. TikTok: 3 customers, $245.', learnSql:'A JOIN combines tables on keys; LEFT JOIN keeps unmatched left rows with NULLs on the right. Joining one-to-many multiplies rows — fan-out — and DISTINCT is the shield.'},
'3.2':{asker:'You, deciding next month’s ad budget', ask:'“I spent $355 and made $910, ROAS is 2.56 — should I just double the ads?”', task:['ROAS can’t answer that; per channel, compute CAC (spend ÷ customers acquired) and value per customer (revenue ÷ customers).','“Acquired” means everyone who signed up via the channel — LEFT JOIN again, or non-buyers vanish from the denominator.','Compare the LTV-to-CAC ratio per channel, not the blended ROAS.'], result:'Instagram CAC $80 / value $105 (ratio 1.3). TikTok CAC $38.33 / value $81.67 (ratio 2.1) — cheaper customers who are worth less, and still the better efficiency. Doubling blindly would double the worse ratio.', learnSql:'A CTE (WITH …) names an intermediate result so a multi-step calculation reads top-to-bottom; denominators are a modeling choice — the same data gives CAC $57.50 or $38.33 depending on who counts as a customer.'},
'3.3':{asker:'You, writing a win-back email', ask:'“Who signed up and never bought anything? Those are the people I need to email.”', task:['Start from all customers; attach orders where they exist.','The people wanted are exactly the ones with no matching order.','LEFT JOIN, then keep only rows where the order side IS NULL.'], result:'Theo and Nia. Two names — that’s the whole email list.', learnSql:'LEFT JOIN + WHERE right-side IS NULL is the standard “rows with no match” pattern; IS NULL is the only honest test for a missing value.'},
'3.4':{asker:'Your bookkeeper', ask:'“One timeline, please: every dollar in and every dollar out, in date order. I don’t care that they live in different tables.”', task:['Orders (in) and ad spend (out) have the same shape: date, direction, amount.','Stack them vertically with UNION ALL — duplicates are real dollars, so no de-duplication.','Skip the $0 spend row; sort the stack by date.'], result:'One chronological money story: spend early in September, revenue answering after. Cause and effect, in order.', learnSql:'UNION stacks result sets with matching columns (and de-duplicates); UNION ALL stacks without de-duplicating — faster, and correct when duplicates are real.'},
'4.1':{asker:'Sam, your roommate', ask:'“Your spreadsheet says I paid less on average. But two receipts got lost — are you counting those as zero, or pretending they never happened?”', task:['Run the honest experiment: SUM, AVG, and AVG with COALESCE side by side on the same column.','SUM and AVG silently skip NULL rows; COUNT(*) shows how many rows really exist.','COALESCE(amount, 0) makes the “treat missing as zero” choice visible instead of silent.'], result:'SUM says $4,193.75; AVG says $524.22 — computed over only 8 of 10 expenses. With COALESCE the average is $419.38 over all 10. Three defensible-looking answers; only the third names its assumption.', learnSql:'NULL is a missing value, not zero: it propagates through math and is skipped by aggregates. COALESCE returns the first non-NULL value, making the assumption explicit in the query.'},
'4.2':{asker:'Maya, your roommate', ask:'“Settle it monthly: who actually carried the house each month?”', task:['Group expenses by roommate and by month — SQLite’s month cut is strftime(’%Y-%m’, date).','LEFT JOIN so a roommate with no expenses in a month still appears.','COALESCE each amount so a lost receipt doesn’t silently shrink a total.'], result:'Maya carries September and October on rent ($1,800 each month); Jordan and Sam cover the smaller, steadier bills. The argument ends.', learnSql:'Date truncation (DATE_TRUNC in Postgres, strftime here) turns timestamps into buckets; grouping by a bucket plus a dimension gives one row per combination.'},
'4.3':{asker:'Jordan, your roommate', ask:'“The payments table is just numbers and IDs. Who paid whom? Give me names.”', task:['Payments reference roommates twice: once as sender, once as receiver.','Join the roommates table twice with two aliases — once per role.','Now both sides of every payment can show a name.'], result:'Five payments, fully named: Jordan → Maya $600, Sam → Maya $600, Sam → Jordan $47.50, and the October rent round. IDs settle nothing; names do.', learnSql:'A self-join joins a table to itself (or joins the same lookup twice) to compare or label rows within it; aliases are what make the two copies distinguishable.'},
'4.4':{asker:'You, before accusing anyone', ask:'“Which expenses have no receipt — and whose are they? Nobody’s paying for a number we can’t prove.”', task:['A lost receipt is amount IS NULL — test for the absence itself.','Join to roommates to attach a name to each missing receipt.','Everyone else is off the hook.'], result:'Exactly two: Jordan’s cleaning and Sam’s household run. Two missing receipts — and zero accusations owed.', learnSql:'amount = NULL is never true, because NULL isn’t a value; the test is IS NULL. Filtering on absence is a query in its own right.'},
'5.1':{asker:'You, Sunday night', ask:'“Twenty applications, one offer, and I’m exhausted. Am I applying badly, or is the funnel breaking somewhere specific?”', task:['Count applications per stage — that staging is the funnel.','Express each stage as a share of all 20 to see where mass is lost.','Name the intermediate result with a CTE so the reasoning reads in order.'], result:'Screen 6, rejected 5, stuck-at-applied 4, interview 4, offer 1. The mass dies at screening, not at applying — volume was never the problem.', learnSql:'A CTE (WITH name AS (…)) names a temporary result so a query reads top-to-bottom like the reasoning that produced it; a funnel is just GROUP BY on a stage column plus shares.'},
'5.2':{asker:'You, planning next month’s applications', ask:'“Same effort everywhere, wildly different results. Is it me, or are some segments just colder?”', task:['Cut the funnel by segment: startup, bigtech, agency.','Per segment: applications, how many reached interview-or-better (conditional SUM over a CASE), and the rate.','Compare rates, not raw counts.'], result:'Startups convert at 50% (4 of 8); bigtech and agency sit at 16.7% and 0%. It’s not effort — it’s mix. Next month’s applications follow the warm segment.', learnSql:'Conditional aggregation — SUM(CASE WHEN … THEN 1 ELSE 0 END) — counts a subset inside each group; segmenting before concluding is how you avoid blaming behavior for a mix shift.'},
'5.3':{asker:'An interviewer', ask:'“Your query filters on the alias n in WHERE and it errored. Why? Most candidates can’t tell me.”', task:['Run the broken query and read the error literally.','Recall the order SQL actually executes: FROM → WHERE → GROUP BY → HAVING → SELECT.','The alias is born in SELECT — after WHERE has already run. Restructure with a CTE and filter outside.'], result:'“No such column: n” — because at WHERE time, n doesn’t exist yet. The CTE version runs and returns the stages with more than 2 applications.', learnSql:'Execution order is why SELECT aliases can’t be filtered in WHERE (or grouped on in some dialects). Knowing the order turns error messages into explanations.'},
'5.4':{asker:'You, reading response times', ask:'“The companies that screened me — how fast did they move? Speed probably tells me something about fit.”', task:['The events table holds two milestones per application: applied and screen.','Join the table to itself: applied-row paired with screen-row per application.','Subtract dates (julianday difference) and rank fastest first.'], result:'Marlow moved in 4 days, Verdant 5, Kiteway 6, Northwind and Corelink 7. The offer came from the fastest mover — speed was signal, not luck.', learnSql:'Self-joining an events table pairs milestones for the same entity; date subtraction (julianday here, DATEDIFF elsewhere) turns two timestamps into a duration.'},
'0.1':{asker:'You, opening the data for the first time', ask:'“Don’t analyze anything yet. Just show me what an order looks like — drink, size, price.”', task:['Name the three columns instead of using *.','No filter, no math — every row comes back.','Read the rows and say the grain out loud.'], result:'Fifteen orders, three facts each. You can already see it: lattes repeat, espresso is cheap, matcha runs large.', learnSql:'SELECT reads columns from a table; naming columns (instead of *) declares exactly what you need and makes the output self-documenting.'},
'0.2':{asker:'Jordan, the shift lead', ask:'“Just the lattes. Who’s buying them and what are they paying?”', task:['Start from all orders; keep only rows where drink is latte.','Text values need single quotes.','Project customer, drink, price.'], result:'Five latte orders from four people — Maya twice. The regular Jordan suspected exists, and she’s already visible in the raw filter.', learnSql:'WHERE tests every row against a condition and keeps the rows that pass; it runs before grouping, sorting, or math.'},
'0.3':{asker:'Maya, the owner', ask:'“What are the three priciest orders we’ve sold? I want to know what the top of the menu looks like.”', task:['Sort by price, highest first: ORDER BY price DESC.','Then cap the result: LIMIT 3.','Order matters — limit without sort returns arbitrary rows.'], result:'A $7.00 large matcha, a $6.50 large latte, then a $6.00 medium matcha. The top of the menu is a large-drink story.', learnSql:'ORDER BY sorts the finished result (DESC = descending); LIMIT truncates it. Together they answer every “top N” question.'},
'1.5':{asker:'Maya, the owner', ask:'“Forget drinks — how is the shop doing day to day? Are we growing?”', task:['Change the grain: one row per day instead of per drink.','Group by ordered_at; count and sum inside each day.','Sort by date so the trend reads left to right.'], result:'Revenue swings $8.50–$17.50 with no climb: Oct 3 spikes, Oct 6 dips back. Six days of weather, not a trend — and saying so is the analysis.', learnSql:'Grouping by a date column turns a table into a time series; the same GROUP BY machinery, pointed at time instead of category.'},
'2.5':{asker:'You, planning the next series', ask:'“One of my YouTube videos is doing the heavy lifting, isn’t it? What share of the channel is each post carrying?”', task:['Keep YouTube posts as rows; compute the YouTube total alongside them.','Each post’s share = its views ÷ the platform total × 100.','The total-beside-every-row shape is a window SUM, not a GROUP BY.'], result:'The newest post carries 36.3% of YouTube’s views; the first carries 14.0%. The channel is increasingly one video — opportunity and fragility in one column.', learnSql:'SUM() OVER (PARTITION BY …) attaches a group total to every row, enabling percent-of-total without collapsing detail.'},
'3.5':{asker:'You, store owner', ask:'“Who are my whales? And don’t just say ‘big spenders’ — bigger than what? Bigger than my average customer.”', task:['First compute each customer’s lifetime total (a grouped subtotal).','Then compute the average of those totals: $151.67 across 6 buyers.','Keep customers above that benchmark — the benchmark itself is a subquery.'], result:'Alex ($350) and Sam ($210) beat the average; nobody else is close. Two customers, $560 of $910 — concentration worth naming before it becomes dependence.', learnSql:'A subquery computes a value the outer query then uses as a threshold; a CTE can hold the subtotal while the subquery holds the benchmark.'},
'4.5':{asker:'The whole house, settling up', ask:'“Enough. Fronting rent, sending payments, receiving payments — net it all out. What has each of us actually borne?”', task:['Three separate flows: expenses fronted, payments sent, payments received — one CTE each.','Missing receipts count as zero (house rule from 4.1).','Net = expenses + sent − received, per roommate; LEFT JOINs so nobody disappears.'], result:'Jordan has borne the most ($1,505.30), then Sam ($1,428.45), then Maya ($1,260.00) — against a fair share of ~$1,397.92. The rent-fronter is owed, not owing, and now it’s arithmetic instead of vibes.', learnSql:'Complex answers compose: multiple CTEs each compute one flow, and the final select combines them. COALESCE at every seam keeps missing pieces at zero instead of NULL-ing the whole person.'},
'5.5':{asker:'You, Monday morning', ask:'“Some of these applications have just… sat there. Who’s gone quiet on me? Give me a follow-up list.”', task:['Filter to stage = applied — the ones still waiting for first contact.','Measure age against an as-of date (Sep 30, 2026): days since applied.','Longest wait first: that ordering is the work list.'], result:'Umbra has waited 12 days, Loomly 11, Ostro 5, Tandem 1. Four follow-ups, in the order they’re owed.', learnSql:'Date subtraction against a fixed as-of date turns a status column into an aging report; the as-of choice is stated, so the numbers are reproducible.'}
};

function lessonDifficulty(l){
  if(l.id.startsWith('0.')) return {label:'Warm-up', xp:15};
  if(l.id === '5.3') return {label:'Debug challenge', xp:65};
  if(l.id.endsWith('.5')) return {label:'Advanced', xp:80};
  if(l.id.endsWith('.4')) return {label:'Deep cut', xp:50};
  if(l.id.endsWith('.3')) return {label:'Thinker', xp:40};

function achievementState(){

  const dbComplete = new Set(), dbsTouched = new Set();

  });
  return {doneKeys, completed:doneKeys.size, dbComplete, dbsTouched, xp:xpEarned(), streak:streak(),

}

  ACHIEVEMENTS.filter(a=>!a.manual && a.when).forEach(a=>{ if(a.when(s)) awardAchievement(a.id); });
}
function noteDay(){
  const today = new Date().toLocaleDateString('en-CA');
  const days = JSON.parse(localStorage.getItem('speakSqlDays')||'[]');
  if(!days.includes(today)){ days.push(today); localStorage.setItem('speakSqlDays', JSON.stringify(days)); }
}
function streak(){
  const days = new Set(JSON.parse(localStorage.getItem('speakSqlDays')||'[]'));
  let n = 0; const d = new Date();
  if(!days.has(d.toLocaleDateString('en-CA'))) d.setDate(d.getDate()-1);
  while(days.has(d.toLocaleDateString('en-CA'))){ n++; d.setDate(d.getDate()-1); }
  return n;
}

// Syntax highlighting for the editor (mockup colors: keywords pink, functions blue, strings green)
function hlSql(src){
  let s = src.replace(/&/g,'&amp;').replace(/</g,'&lt;');
  s = s.replace(/(--[^\n]*)|('(?:[^']|'')*')|\b(CREATE\s+TABLE|PRIMARY\s+KEY|SELECT|FROM|WHERE|GROUP\s+BY|ORDER\s+BY|HAVING|LIMIT|JOIN|LEFT\s+JOIN|RIGHT\s+JOIN|INNER\s+JOIN|ON|AS|CASE|WHEN|THEN|ELSE|END|WITH|UNION\s+ALL|UNION|DISTINCT|AND|OR|NOT|NULL|IS|IN|OVER|PARTITION\s+BY|CAST|DESC|ASC|BETWEEN|LIKE|BY|CREATE|TABLE|PRIMARY|KEY|INTEGER|TEXT|REAL)\b|\b(SUM|COUNT|AVG|ROUND|LAG|LEAD|RANK|DENSE_RANK|ROW_NUMBER|COALESCE|MAX|MIN|julianday|printf)\s*(?=\()/gi,
    (m, com, str, kw, fn) => com ? '<span class="com">'+com+'</span>' : str ? '<span class="str">'+str+'</span>' : kw ? '<span class="kw">'+kw+'</span>' : '<span class="fn">'+fn+'</span>');
  return s + '\n';
}
function syncHl(){
  const ta = document.getElementById('sqlbox'), pre = document.getElementById('hlcode');
  if(!ta || !pre) return;
  pre.innerHTML = hlSql(ta.value);
  pre.scrollTop = ta.scrollTop; pre.scrollLeft = ta.scrollLeft;
}

function loadDb(d){
  curDb = d;
  db = new SQL.Database();
  db.run(d.schema); db.run(d.seed);
  showLesson(d, d.lessons[0]);
}
function renderSidebar(){
  const sb = document.getElementById('sidebar');
  sb.innerHTML = DATABASES.map(d=>{
    const lessons = d.lessons.map(l=>`<button class="lessonbtn ${curLesson&&curLesson.id===l.id&&curDb===d?'active':''}" data-db="${d.id}" data-lesson="${l.id}"><span>${done[d.id+':'+l.id]?'<span class="done">✓</span> ':''}${l.id} ${l.title}</span><span class="diffchip">${lessonDifficulty(l).xp} XP</span></button>`).join('');
    return `<h2>${d.name}</h2>${lessons}`;
  }).join('') + `<div class="donatebox"><a href="${DONATE_URL}" target="_blank" rel="noopener">☕ Buy me a coffee</a><div style="margin-top:6px">Keeps the lessons free.</div></div>`;
  sb.querySelectorAll('.lessonbtn').forEach(b=>b.onclick=()=>{
    const d = DATABASES.find(x=>x.id===b.dataset.db);

    showLesson(d,l);
